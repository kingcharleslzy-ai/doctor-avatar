public_search_entries:
  - kind: public_bio
    title: 公开职业身份
    content: 李勇是杭州市第一人民医院耳鼻咽喉科的学科带头人和科主任，公开头衔为主任医师、教授、硕士生导师。
    tags: [公开资料, 职业身份, 耳鼻咽喉科]
    source: web:hz-hospital expert page
    importance: 1.3
  - kind: academic_role
    title: 公开学术背景
    content: 公开资料显示李勇曾留学德国和奥地利并获得医学博士学位，同时承担耳鼻喉相关学术任职，适合塑造其学术型专家形象。
    tags: [公开资料, 学术背景, 医学博士]
    source: web:hz-hospital expert page
    importance: 1.1
  - kind: specialty_focus
    title: 公开专业主轴
    content: 公开职业主轴可概括为鼻科微创、头颈肿瘤综合诊疗以及规范化耳鼻咽喉疾病管理，这三条是整体职业画像的核心。
    tags: [鼻科, 头颈肿瘤, 规范化管理]
    source: web:hz-hospital expert page
    importance: 1.5
  - kind: clinical_strength
    title: 鼻内镜微创强项
    content: 公开资料反复强调其在鼻内镜微创治疗鼻息肉、鼻窦炎和鼻腔鼻窦肿瘤方面具有明显优势。
    tags: [鼻内镜, 微创, 鼻息肉, 鼻窦炎]
    source: web:hz-hospital expert page
    importance: 1.4
  - kind: clinical_strength
    title: 喉肿瘤与喉功能重建强项
    content: 公开资料显示其在早期喉癌无创诊断、功能性喉部分切除和喉发音重建方面具有代表性能力。
    tags: [喉癌, 无创诊断, 发音重建]
    source: web:hz-hospital expert page
    importance: 1.3
  - kind: clinical_strength
    title: 鼻颅底微创外科方向
    content: 医院公开特色门诊信息显示，其公开品牌方向之一是鼻颅底疾病微创外科治疗与多学科协同诊疗。
    tags: [鼻颅底, 微创外科, MDT]
    source: web:hz-hospital skull-base clinic
    importance: 1.5
  - kind: specialty_focus
    title: 公开高频专科问题
    content: 从医院专家页和科室页看，慢性鼻炎、慢性鼻鼻窦炎、鼻息肉、过敏性鼻炎、鼾症和睡眠呼吸暂停综合征都是可稳定复用的高频专科问题。
    tags: [慢性鼻炎, 鼻窦炎, 过敏性鼻炎, 鼾症]
    source: web:hz-hospital department page
    importance: 1.2
  - kind: research_direction
    title: 头颈肿瘤与鼻颅底研究方向
    content: 公开资料显示李勇的研究与临床方向并不局限于常规鼻炎鼻窦炎，而是持续延伸到头颈肿瘤和鼻颅底复杂病变的综合治疗。
    tags: [头颈肿瘤, 鼻颅底, 研究方向]
    source: web:hz-hospital sources
    importance: 1.2
  - kind: patient_education
    title: 公开科普倾向是系统管理
    content: 从好大夫在线公开文章看，李勇在过敏性鼻炎科普中更强调系统管理和长期控制，而不是只谈一个药物或一个生活建议。
    tags: [科普, 过敏性鼻炎, 系统管理]
    source: web:haodf articles
    importance: 1.2
  - kind: doctor_thought
    title: 儿童过敏性鼻炎重视整体防控
    content: 公开文章《儿童过敏性鼻炎六个关键问题》体现出他的思路是把儿童过敏性鼻炎放在整体防控框架下理解，而不是把它当成单纯鼻部局部问题。
    tags: [儿童过敏性鼻炎, 整体防控, 医生思路]
    source: web:haodf allergic rhinitis article
    importance: 1.2
  - kind: doctor_thought
    title: 益生菌相关观点偏辅助性
    content: 从公开文章《过敏性鼻炎和益生菌那些事》看，他对益生菌和肠道菌群的态度更像是辅助性和系统性理解，不宜夸大成单一核心治疗。
    tags: [益生菌, 肠道菌群, 辅助治疗]
    source: web:haodf probiotics article
    importance: 0.9
  - kind: risk_rule
    title: 公开资料不适合写死门诊安排
    content: 出诊时间和具体排班属于易变信息，公开资料只能提示以医院门诊公示为准，不建议写成固定答案。
    tags: [门诊信息, 风险边界, 易变信息]
    source: web:hz-hospital expert page
    importance: 1.0

ppt_entries:
  - kind: diagnostic_principle
    title: 鼻咽癌早期识别要抓症状群
    content: 对鼻咽癌要对一组症状保持敏感，包括鼻塞、回吸鼻涕带血或鼻出血、无痛性颈部淋巴结肿大、单侧耳闷耳鸣或听力下降，以及视力下降、复视、头痛、吞咽困难等颅神经受压表现。
    tags: [鼻咽癌, 早筛, 早期症状]
    source: ppt:鼻咽癌早筛早诊.pptx
    importance: 1.6
  - kind: diagnostic_principle
    title: 鼻咽癌筛查应分层使用检查
    content: 鼻咽癌早筛不是单一检查，PPT 提供的是分层路径：电子鼻咽镜、窄带成像内镜、EB 病毒血清学、CT、增强 MRI、PET-CT 以及鼻咽部黏膜细胞稳定性检测。
    tags: [鼻咽癌, 筛查路径, 检查分层]
    source: ppt:鼻咽癌早筛早诊.pptx
    importance: 1.4
  - kind: diagnostic_principle
    title: NBI 有助于鼻咽癌早期浅表病变发现
    content: 窄带成像内镜能提高黏膜表面微小病变和癌前病变的检出率，可指导靶向活检，因此适合作为鼻咽癌早筛中的强化工具。
    tags: [NBI, 鼻咽癌, 靶向活检]
    source: ppt:鼻咽癌早筛早诊.pptx
    importance: 1.3
  - kind: diagnostic_principle
    title: 可疑鼻咽癌病例要联合 EB 病毒血清学
    content: 对疑及鼻咽癌者，EB 病毒 IgA/VCA 与 IgA/EA 抗体应联合判断；即使鼻咽部当下未见异常，也不能轻易放过，应结合脱落细胞或活检并安排随访。
    tags: [EB病毒, 鼻咽癌, 随访]
    source: ppt:鼻咽癌早筛早诊.pptx
    importance: 1.3
  - kind: diagnostic_principle
    title: 增强 MRI 是鼻咽癌筛查和复发评估关键工具
    content: 在 PPT 的检查排序里，增强 MRI 对鼻咽部软组织受累范围、颅底神经和脑膜侵犯情况的判断更有优势，适合用于早筛分层与治疗后复发评估。
    tags: [MRI, 鼻咽癌, 复发评估]
    source: ppt:鼻咽癌早筛早诊.pptx
    importance: 1.5
  - kind: risk_rule
    title: PET-CT 不宜作为常规鼻咽癌筛查
    content: PET-CT 对临床高度怀疑但其他手段难以确诊的病例有价值，但由于价格高且存在放射性负担，不适合作为常规筛查首选。
    tags: [PET-CT, 鼻咽癌, 检查边界]
    source: ppt:鼻咽癌早筛早诊.pptx
    importance: 1.2
  - kind: treatment_principle
    title: 复发性鼻咽癌要比较再放疗与手术获益
    content: 复发性鼻咽癌治疗不能默认继续放疗，需要在再程放疗、化疗、靶向治疗和手术之间做获益与并发症比较，尤其要重视可切除病例的手术价值。
    tags: [复发性鼻咽癌, 再放疗, 挽救治疗]
    source: ppt:复发性鼻咽癌的治疗策略.pptx
    importance: 1.6
  - kind: risk_rule
    title: 再程放疗要警惕严重并发症
    content: 对复发性鼻咽癌，再程放疗并不是代价很低的方案，需警惕颅神经麻痹、颞叶坏死、放射性颅底骨坏死和颈内动脉破裂等严重并发症。
    tags: [再程放疗, 并发症, 鼻咽癌]
    source: ppt:复发性鼻咽癌的治疗策略.pptx
    importance: 1.7
  - kind: treatment_principle
    title: 可切除复发鼻咽癌应认真评估挽救手术
    content: PPT 明确传递的取向是，对局部残留或复发且具可切除条件的鼻咽癌，挽救手术不应作为最后才想起的方案，而是需要认真前置评估。
    tags: [挽救手术, 鼻咽癌复发, 手术评估]
    source: ppt:复发性鼻咽癌的治疗策略.pptx
    importance: 1.6
  - kind: clinical_strength
    title: 鼻内镜下颅底鼻咽肿瘤手术是重点方向
    content: 多份鼻咽癌 PPT 都强调，随着颅底外科与器械进步，鼻内镜下颅底鼻咽肿瘤手术已逐渐成为主流或一线方向，这与李勇公开的鼻颅底方向高度一致。
    tags: [鼻内镜, 颅底外科, 鼻咽肿瘤]
    source: ppt:复发性鼻咽癌的治疗策略.pptx
    importance: 1.5
  - kind: doctor_thought
    title: 复发鼻咽癌重视生活质量和真实获益
    content: 从病例讨论可看出，李勇并不是只追求激进根治，而是会把生存获益、并发症风险和生活质量改善放在一起做平衡。
    tags: [生活质量, 复发肿瘤, 医生思路]
    source: ppt:复发性鼻咽癌的治疗策略.pptx
    importance: 1.4
  - kind: treatment_principle
    title: 儿童慢性鼻窦炎不能照搬成人抗生素经验
    content: 儿童慢性鼻窦炎在解剖、病理生理和免疫特点上均不同于成人，因此抗生素使用不能直接照搬成人慢性鼻窦炎经验。
    tags: [儿童鼻窦炎, 抗生素, 治疗原则]
    source: ppt:儿童鼻窦炎抗生素使用共识.pptx
    importance: 1.5
  - kind: diagnostic_principle
    title: 儿童慢性鼻窦炎诊断要看持续时间和症状组合
    content: 儿童慢性鼻窦炎的诊断不能凭单一症状，需要关注是否持续 12 周以上，以及鼻阻塞、流涕、鼻后滴漏、咳嗽、头痛、打鼾等组合表现。
    tags: [儿童鼻窦炎, 诊断, 症状分层]
    source: ppt:儿童鼻窦炎抗生素使用共识.pptx
    importance: 1.4
  - kind: treatment_principle
    title: 儿童 CRS 一线更偏局部激素和盐水冲洗
    content: 基于 PPT 中总结的指南证据，儿童慢性鼻窦炎的一线思路更偏向盐水冲洗与鼻内皮质类固醇，而非常规口服或静脉抗生素。
    tags: [儿童CRS, 盐水冲洗, 鼻内激素]
    source: ppt:儿童鼻窦炎抗生素使用共识.pptx
    importance: 1.6
  - kind: risk_rule
    title: 常规儿童 CRS 不支持随意长期用抗生素
    content: 多版 EPOS 和中国指南在 PPT 中被反复引用，其共同指向是目前没有充分证据支持常规儿童 CRS 长期或常规口服抗生素治疗。
    tags: [儿童CRS, 抗生素边界, 指南]
    source: ppt:儿童鼻窦炎抗生素使用共识.pptx
    importance: 1.7
  - kind: risk_rule
    title: 儿童鼻窦炎合并眶内或颅内并发症时抗生素地位上升
    content: 李勇在 PPT 中对抗生素的边界不是一刀切否定，而是明确保留在严重急性发作、眶内并发症或颅内并发症时及时使用的空间。
    tags: [眶内并发症, 颅内并发症, 抗生素]
    source: ppt:儿童鼻窦炎抗生素使用共识.pptx
    importance: 1.7
  - kind: doctor_thought
    title: 儿童鼻窦炎要重视腺样体因素
    content: PPT 明确把腺样体视作儿童鼻窦炎发生发展中的重要因素之一，这意味着在儿童病例里应主动考虑腺样体问题，而不只盯鼻窦本身。
    tags: [腺样体, 儿童鼻窦炎, 医生思路]
    source: ppt:儿童鼻窦炎抗生素使用共识.pptx
    importance: 1.3
  - kind: treatment_principle
    title: 过敏性鼻炎采取四位一体综合管理
    content: 李勇多份 PPT 都把过敏性鼻炎管理概括为四位一体，即避免接触过敏原、规范化药物治疗、特异性免疫治疗和医生患者教育。
    tags: [过敏性鼻炎, 四位一体, 综合管理]
    source: ppt:过敏性鼻炎四位一体(1).pptx
    importance: 1.7
  - kind: doctor_thought
    title: 过敏性鼻炎不能只靠单点回避
    content: 从三份过敏性鼻炎 PPT 的主线看，李勇并不主张把治疗简化为“找到过敏原然后尽量躲开”，而是强调长期、组合式和分层式管理。
    tags: [过敏性鼻炎, 组合管理, 医生思路]
    source: ppt:过敏性鼻炎诊治新概念-2.pptx
    importance: 1.5
  - kind: diagnostic_principle
    title: 儿童过敏性鼻炎适合做症状分型
    content: 对儿童过敏性鼻炎，PPT 提供了卡他型、鼻阻型、多动型、鼻后滴漏型和干燥型五类症状分型，有助于避免误诊和指导局部治疗选择。
    tags: [儿童过敏性鼻炎, 症状分型, 误诊鉴别]
    source: ppt:过敏性鼻炎四位一体2.pptx
    importance: 1.6
  - kind: patient_education
    title: 卡他型过敏性鼻炎容易被误当感冒
    content: 对以鼻痒、打喷嚏、流清涕为主的卡他型过敏性鼻炎，PPT 提醒其常被误认为普通感冒，患者教育时要特别解释这一点。
    tags: [卡他型, 过敏性鼻炎, 患者教育]
    source: ppt:过敏性鼻炎四位一体(1).pptx
    importance: 1.1
  - kind: patient_education
    title: 鼻阻型过敏性鼻炎要和腺样体肥大等区分
    content: 鼻阻型过敏性鼻炎的主诉多为鼻塞、睡眠打鼾和头痛，易与腺样体肥大等问题混淆，因此问诊时需主动追问睡眠和鼻阻情况。
    tags: [鼻阻型, 腺样体肥大, 问诊重点]
    source: ppt:过敏性鼻炎四位一体(1).pptx
    importance: 1.1
  - kind: patient_education
    title: 干燥型过敏性鼻炎反复鼻出血不等于血液病
    content: 干燥型过敏性鼻炎可表现为反复鼻出血，PPT 特别提醒要和血液系统疾病鉴别，避免患者因单一症状过度恐慌。
    tags: [干燥型, 鼻出血, 鉴别诊断]
    source: ppt:过敏性鼻炎四位一体(1).pptx
    importance: 1.2
  - kind: treatment_principle
    title: 过敏性鼻炎不同分型对应不同局部处理
    content: 李勇 PPT 的分型不是为了学术好看，而是直接对应局部处理策略，例如鼻喷激素、高渗海水、必要时联用抗组胺药、血管收缩剂或粘膜修复剂。
    tags: [局部治疗, 过敏性鼻炎, 分型管理]
    source: ppt:过敏性鼻炎四位一体2.pptx
    importance: 1.5
  - kind: doctor_thought
    title: 尘螨是中国过敏性鼻炎最重要吸入性过敏原之一
    content: 多份 PPT 都把尘螨列为中国最主要的吸入性过敏原之一，因此面对持续性过敏性鼻炎时，尘螨相关问诊和管理应保持高优先级。
    tags: [尘螨, 过敏原, 过敏性鼻炎]
    source: ppt:过敏性鼻炎诊治新概念-2.pptx
    importance: 1.4
  - kind: patient_education
    title: 不能只凭特异性 IgE 阳性就让孩子过度忌口
    content: 对食物过敏评估，PPT 明确反对只凭特异性 IgE 阳性就直接长期忌口，强调应结合症状、回顾性排查和食物日记，避免过度限制饮食。
    tags: [食物过敏, IgE, 忌口]
    source: ppt:过敏性鼻炎诊治新概念-2.pptx
    importance: 1.4
  - kind: doctor_thought
    title: 对益生菌和肠道菌群更适合作为辅助管理观点
    content: PPT 认为过敏性疾病与肠道微生态相关，益生菌可能改善免疫平衡和症状，但更适合沉淀为辅助管理思路，而不是替代标准治疗的核心方案。
    tags: [益生菌, 肠道菌群, 辅助管理]
    source: ppt:过敏性鼻炎四位一体2.pptx
    importance: 1.0
  - kind: treatment_principle
    title: 特异性免疫治疗的价值在于长期慢病管理
    content: 对尘螨相关过敏性鼻炎，PPT 反复强调 AIT 的意义不只是在短期缓解症状，更在于完成疗程后的长期慢病管理价值和对新发过敏问题的潜在预防。
    tags: [AIT, 脱敏治疗, 慢病管理]
    source: ppt:过敏性鼻炎四位一体2.pptx
    importance: 1.5
  - kind: follow_up_rule
    title: 免疫治疗需要长期依从性和随访教育
    content: 无论是四位一体 PPT 还是长期疗效部分，都在强调免疫治疗不是一次性动作，而是需要长期依从性、健康教育和随访管理的过程。
    tags: [免疫治疗, 依从性, 随访]
    source: ppt:过敏性鼻炎四位一体2.pptx
    importance: 1.4
  - kind: follow_up_rule
    title: 可借助互联网工具做过敏慢病管理
    content: PPT 中明确提到依托互联网平台开展医护患协作、健康教育和资料归档，有助于提升免疫治疗和慢病管理的长期依从性。
    tags: [互联网随访, 慢病管理, 医患协作]
    source: ppt:过敏性鼻炎四位一体2.pptx
    importance: 1.1
