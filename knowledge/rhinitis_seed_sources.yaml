        content: 患者提到辅舒良时，系统可先映射为氟替卡松 fluticasone 和鼻用糖皮质激素类别；患者提到莫米松、布地奈德时，也归入鼻喷激素/鼻用糖皮质激素用药史。具体商品、剂型、用法和禁忌必须以医生确认和药品说明书为准。
        topic_tags: [辅舒良, 氟替卡松, fluticasone, 莫米松, 布地奈德, 鼻喷激素]
      - heading: 抗组胺别名
        scenario: doctor_summary
        content: 患者提到氯雷他定、西替利嗪、非索非那定、地氯雷他定或左西替利嗪时，系统可归入第二代抗组胺药用药史，用于医生端摘要和待确认项。
        topic_tags: [抗组胺, 氯雷他定, 西替利嗪, 非索非那定]

