    title: "Chinese Guideline on Allergen Immunotherapy for Allergic Rhinitis: The 2022 Update"
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9709690/
    pmid: "36426395"
    pmcid: PMC9709690
    doi: 10.4168/aair.2022.14.6.604
    year: 2022
    journal_or_org: Allergy Asthma Immunol Res
    language: en
    evidence_level: guideline
    review_status: approved
    license_status: open_access
    open_access: true
    patient_visible: false
    doctor_visible: true
    research_visible: true
    topic_tags: [免疫治疗, 脱敏治疗, 尘螨, SCIT, SLIT, 合并哮喘]
    content_summary: 中国变应原免疫治疗指南英文更新版，适合整理免疫治疗适应证、依从性和安全性提示。
    chunks:
      - heading: 免疫治疗候选项
        scenario: doctor_summary
        content: 变应原免疫治疗需要结合明确过敏原、症状严重程度、药物治疗效果、患者偏好、依从性、便利性和安全性进行评估，不能由线上系统单独决定。
        topic_tags: [免疫治疗, 过敏原, 医生摘要]
      - heading: 患者宣教
        scenario: patient_education
        patient_visible: true
        content: 脱敏治疗通常需要较长周期和规范随访，是否适合要由医生结合过敏原检测、症状控制情况和个人风险判断。患者不要自行购买或更换治疗方案。
        topic_tags: [患者宣教, 脱敏治疗, 随访]

