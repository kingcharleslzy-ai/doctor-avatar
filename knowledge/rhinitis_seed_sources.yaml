documents:
  - source_key: pubmed_cn_ar_guideline_2022
    source_bucket: guideline_candidates
    source_type: guideline
    title: 中国变应性鼻炎诊断和治疗指南（2022年，修订版）
    url: https://pubmed.ncbi.nlm.nih.gov/35078291/
    pmid: "35078291"
    year: 2022
    journal_or_org: 中华耳鼻咽喉头颈外科杂志
    language: zh
    evidence_level: guideline
    review_status: approved
    license_status: public_metadata
    open_access: false
    patient_visible: false
    doctor_visible: true
    research_visible: true
    topic_tags: [指南, 诊断, 治疗, 鼻喷激素, 抗组胺, 免疫治疗, 过敏原]
    content_summary: 中国成人变应性鼻炎诊断和治疗核心指南，适合作为医生端摘要、诊断依据提示和治疗路径边界。
    chunks:
      - heading: 适用场景
        scenario: doctor_summary
        content: 成人变应性鼻炎评估应综合症状特征、发作时间、诱因暴露、伴随眼部或哮喘症状、既往用药反应和过敏原检测等信息。线上系统只能整理病史和检查线索，不能替代面诊诊断。
        topic_tags: [诊断, 医生摘要, 过敏原]
      - heading: 治疗路径
        scenario: doctor_summary
        content: 指南相关治疗线索包括鼻用糖皮质激素、第二代抗组胺药、白三烯受体拮抗剂、鼻腔冲洗、环境控制和变应原免疫治疗等。系统应只做类别解释和待确认项，不生成处方剂量。
        topic_tags: [鼻喷激素, 抗组胺, 孟鲁司特, 免疫治疗]
      - heading: 患者边界
        scenario: patient_education
        patient_visible: true
        content: 如果反复鼻塞、喷嚏、清水样流涕和鼻痒在接触花粉、尘螨、宠物或冷空气后加重，建议准备症状持续时间、诱因、既往用药和检查结果，再到耳鼻喉科或变态反应科评估。
        topic_tags: [患者宣教, 花粉, 尘螨]

  - source_key: pmc_chinese_ait_guideline_2022
    source_bucket: guideline_candidates
