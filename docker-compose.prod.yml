services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EMBED_CACHE_DIR=/app_cache
      - DOCTOR_MEMORY_DB_PATH=/app_data/doctor_memory.db
    volumes:
      - embed_cache:/app_cache
      - doctor_memory:/app_data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - doctor_avatar_net

  nginx:
    image: nginx:1.27-alpine
    profiles:
      - docker-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
    networks:
      - doctor_avatar_net

  certbot:
    image: certbot/certbot:latest
    profiles:
      - docker-nginx
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt

networks:
  doctor_avatar_net:
    driver: bridge

volumes:
  embed_cache:
  doctor_memory:
