<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>李勇医生 AI 医疗助手</title>
  <link rel="icon" href="/favicon.ico" />
  <script defer src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg-primary: #f0f4ff;
      --bg-secondary: #e8eef7;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --text: #1a2744;
      --muted: #5a6a8a;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.3);
      --accent-light: rgba(37, 99, 235, 0.1);
      --ai-color: #7c3aed;
      --ai-glow: rgba(124, 58, 237, 0.3);
      --success: #10b981;
      --line: rgba(26, 39, 68, 0.08);
      --warning-bg: rgba(255,246,234,0.96);
      --warning-line: rgba(193,123,47,0.18);
      --shadow: 0 8px 32px rgba(26, 39, 68, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text);
      display: flex; justify-content: center;
    }

    /* 手机容器 */
    .phone-container {
      width: 100%; max-width: 430px;
      height: 100%; display: flex; flex-direction: column;
      position: relative;
      background: var(--surface-solid);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.1);
    }

    /* 背景装饰 */
    .bg-decoration {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; overflow: hidden;
    }
    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(60px); opacity: 0.4;
    }
    .bg-orb-1 {
      width: 300px; height: 300px;
      background: var(--accent-glow);
      top: -100px; right: -50px;
      animation: float 15s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 200px; height: 200px;
      background: var(--ai-glow);
      bottom: 50px; left: -80px;
      animation: float 15s ease-in-out infinite reverse;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }

    /* ── 头部 ── */
    .header {
      position: relative; z-index: 1;
      padding: 16px 16px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      background: linear-gradient(180deg, var(--surface) 0%, var(--surface-solid) 100%);
      display: flex; align-items: center; gap: 14px;
      animation: slideDown 0.5s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .avatar-wrapper { position: relative; flex-shrink: 0; }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(26, 39, 68, 0.1);
    }
    .avatar svg { width: 42px; height: 42px; }
    .avatar-glow {
      position: absolute; inset: -8px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      animation: glowPulse 3s ease-in-out infinite; z-index: -1;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }
    .online-dot {
      position: absolute; bottom: 2px; right: 2px;
      width: 14px; height: 14px;
      background: var(--success); border-radius: 50%;
      border: 2px solid var(--surface-solid);
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 2px 10px rgba(16, 185, 129, 0.6); }
    }
    .doctor-info { flex: 1; }
    .doctor-info h1 { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
    .doctor-info p { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .hospital-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px;
      background: var(--accent-light); border-radius: 999px;
      color: var(--accent); font-size: 11px; font-weight: 600;
    }

    /* ── 操作按钮区 ── */
    .actions {
      position: relative; z-index: 1;
      padding: 0 16px 12px;
      display: flex; flex-direction: column; gap: 10px;
      background: var(--surface-solid);
      animation: fadeIn 0.6s ease-out 0.1s both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 开始问诊按钮：大且醒目 */
    .start-consult-btn {
      width: 100%; padding: 16px 24px;
      border: none; border-radius: var(--radius-md);
      font-size: 17px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      position: relative; overflow: hidden;
    }
    .start-consult-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
      pointer-events: none;
    }
    .start-consult-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .start-consult-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* 结束问诊按钮 */
    .end-consult-btn {
      width: 100%; padding: 14px 24px;
      border: none; border-radius: var(--radius-md);
      font-size: 15px; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
      transition: all 0.3s ease;
      /* visibility controlled by inline style, not CSS */
      align-items: center; justify-content: center; gap: 10px;
    }
    .end-consult-btn:active { transform: scale(0.98); }

    .conn-status-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .conn-status {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 12px;
    }
    .conn-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #9ca3af; flex-shrink: 0;
      transition: background 0.3s;
    }
    .conn-dot.live { background: var(--success); }
    .aux-action-row { display: flex; gap: 8px; }
    .aux-action-btn {
      padding: 7px 14px;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted); font-size: 12px;
      cursor: pointer; display: none; /* hidden by default */
    }
    .danger-aux {
      color: #8f4141;
      background: rgba(165,76,76,0.07);
      border-color: rgba(165,76,76,0.14);
    }

    /* ── video stage (hidden until active) ── */
    .video-zone {
      position: relative; z-index: 1;
      display: none; /* shown by JS when video active */
    }
    .video-stage {
      width: 100%; min-height: 200px;
      background: linear-gradient(180deg, #121a25 0%, #0a1118 100%);
      position: relative; overflow: hidden;
    }
    .video-stage > * { width: 100%; height: 100%; }

    /* ── 聊天区域 ── */
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      position: relative; z-index: 1;
      background: var(--surface-solid);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      margin-top: 4px;
      animation: slideUp 0.6s ease-out 0.2s both;
      min-height: 0;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-header h2 { font-size: 15px; font-weight: 600; }
    .model-badge {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: rgba(124, 58, 237, 0.1);
      border-radius: 999px; font-size: 10px; font-weight: 600;
      color: var(--ai-color);
    }

    .chat-history {
      flex: 1; overflow-y: auto;
      padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }
    .chat-history::-webkit-scrollbar { width: 4px; }
    .chat-history::-webkit-scrollbar-thumb {
      background: rgba(26, 39, 68, 0.15); border-radius: 2px;
    }

    /* 消息 */
    .msg-row { display: flex; flex-direction: column; animation: messageIn 0.3s ease-out; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.ai   { align-items: flex-start; }
    @keyframes messageIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ai-label {
      font-size: 10px; font-weight: 600; color: var(--ai-color);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px;
    }
    .bubble {
      max-width: 88%; font-size: 15px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%);
      color: #fff; padding: 10px 15px;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .msg-row.ai .bubble {
      max-width: 100%; color: var(--text); padding: 0;
    }
    .typing-dots {
      display: inline-flex; gap: 5px; padding: 10px 14px;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      border-radius: 18px 18px 18px 4px;
    }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%,100% { transform: translateY(0); opacity: 0.4; }
      50%      { transform: translateY(-5px); opacity: 1; }
    }

    /* 快捷提问 */
    .quick-prompts {
      padding: 0 16px 8px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .prompt-pill {
      padding: 7px 14px; border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-light), rgba(124, 58, 237, 0.06));
      border: 1px solid rgba(37, 99, 235, 0.15);
      color: var(--accent); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .prompt-pill:active { transform: scale(0.96); }

    /* ── 输入区 ── */
    .chat-footer {
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 16px));
      border-top: 1px solid var(--line);
      display: grid; gap: 8px;
      background: var(--surface-solid);
    }
    .voice-hint { font-size: 12px; color: var(--muted); min-height: 14px; }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
    }
    .chat-textarea {
      flex: 1; padding: 12px 18px;
      border: 1px solid var(--line); border-radius: 24px;
      background: #f8fafc; color: var(--text);
      font: inherit; font-size: 15px; line-height: 1.5;
      resize: none; outline: none;
      min-height: 22px; max-height: 120px; overflow-y: auto;
      transition: all 0.3s ease;
    }
    .chat-textarea::placeholder { color: var(--muted); }
    .chat-textarea:focus {
      border-color: var(--accent);
      background: var(--surface-solid);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    .send-btn {
      width: 46px; height: 46px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%);
      color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 20px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: all 0.3s ease;
    }
    .send-btn:active { transform: scale(0.95); box-shadow: 0 2px 8px var(--accent-glow); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .aux-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .aux-btn {
      min-height: 36px; padding: 0 14px;
      border-radius: 999px;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      color: var(--muted); font-size: 13px;
      display: flex; align-items: center; gap: 5px;
      cursor: pointer; transition: all 0.2s;
    }
    .aux-btn:active { opacity: 0.72; transform: scale(0.96); }
    .aux-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── 按钮基础 ── */
    button {
      border: 0; cursor: pointer; font: inherit;
      transition: opacity 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── 医生信息折叠 ── */
    .details-section {
      border-top: 1px solid var(--line); overflow: hidden;
    }
    .details-section summary {
      padding: 14px 16px; cursor: pointer; list-style: none;
      font-size: 14px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
      user-select: none;
    }
    .details-section summary::-webkit-details-marker { display: none; }
    .details-section summary::after {
      content: "\203A"; color: var(--muted); font-size: 18px;
      transition: transform 0.2s;
    }
    .details-section[open] summary::after { transform: rotate(90deg); }
    .details-body {
      padding: 0 16px 14px; border-top: 1px solid var(--line);
      display: grid; gap: 12px;
    }
    .notice {
      padding: 10px 14px; border-radius: 14px;
      background: var(--warning-bg); border: 1px solid var(--warning-line);
      color: #7c5a2f; font-size: 12px; line-height: 1.8;
    }
    .output { font-size: 13px; line-height: 1.85; white-space: pre-wrap; }
    .muted { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 5px 12px; border-radius: 999px;
      background: var(--accent-light);
      border: 1px solid rgba(37, 99, 235, 0.12);
      color: var(--accent); font-size: 11px; font-weight: 500;
    }
    .list {
      margin: 0; padding-left: 18px;
      color: var(--muted); font-size: 13px; line-height: 1.85;
    }
    .links { display: grid; gap: 6px; }
    .links a {
      color: var(--accent); text-decoration: none;
      font-size: 13px; word-break: break-word;
    }

    /* 全局滚动条 */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(26, 39, 68, 0.15); border-radius: 2px; }
  </style>
</head>
<body>
  <div class="phone-container">
    <!-- 背景装饰 -->
    <div class="bg-decoration">
      <div class="bg-orb bg-orb-1"></div>
      <div class="bg-orb bg-orb-2"></div>
    </div>

    <!-- 头部 -->
    <header class="header">
      <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <div class="avatar">
          <svg viewBox="0 0 100 100" fill="none">
            <circle cx="50" cy="32" r="18" fill="#cbd5e1"/>
            <path d="M24 82c0-14.359 11.641-26 26-26s26 11.641 26 26" fill="#cbd5e1"/>
            <circle cx="42" cy="30" r="2.5" fill="#64748b"/>
            <circle cx="58" cy="30" r="2.5" fill="#64748b"/>
            <path d="M44 38c1.5 1.5 7.5 1.5 12 0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M32 52h36v4c0 8-6 14-14 18-8-4-14-10-14-18v-4z" fill="#2563eb" opacity="0.8"/>
            <path d="M38 52v20" stroke="#1d4ed8" stroke-width="1.5"/>
            <path d="M50 52v22" stroke="#1d4ed8" stroke-width="1.5"/>
            <path d="M62 52v18" stroke="#1d4ed8" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="online-dot"></div>
      </div>
      <div class="doctor-info">
        <h1 id="heroTitle">李勇医生</h1>
        <p id="brandSubtitle">杭州市第一人民医院 · 耳鼻咽喉科</p>
        <span class="hospital-tag">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          <span id="hospitalValue">杭州市第一人民医院</span>
        </span>
      </div>
    </header>

    <!-- 操作按钮 -->
    <div class="actions">
      <button id="startConsultBtn" class="start-consult-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        开始问诊
      </button>
      <button id="endConsultBtn" class="end-consult-btn" style="display:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
        结束问诊
      </button>
      <div class="conn-status-row">
        <div class="conn-status">
          <span class="conn-dot" id="connDot"></span>
          <span id="connectionState">未启用</span>
        </div>
        <div class="aux-action-row">
          <button id="keepAliveBtn" class="aux-action-btn" style="display:none">保持会话</button>
          <button id="disconnectBtn" class="aux-action-btn danger-aux" style="display:none">断开</button>
        </div>
      </div>
    </div>

    <!-- 视频区（隐藏，LiveKit 激活时显示） -->
    <div class="video-zone">
      <div class="video-stage" id="videoStage"></div>
    </div>

    <!-- 聊天区域 -->
    <div class="chat-area">
      <div class="chat-header">
        <h2>AI 医疗助手</h2>
        <span class="model-badge">AI 助手</span>
      </div>

      <div id="chatHistory" class="chat-history">
        <div class="msg-row ai">
          <div class="ai-label">AI 医疗助手</div>
          <div class="bubble">您好，我是李勇医生的 AI 助手，专注耳鼻咽喉科常见问题的健康科普与就医建议。请问有什么可以帮您？</div>
        </div>
      </div>

      <div id="quickPrompts" class="quick-prompts"></div>

      <!-- 医生信息折叠 -->
      <details class="details-section">
        <summary>医生信息与资料来源</summary>
        <div class="details-body">
          <div class="notice" id="clinicNote">提醒：仅供健康科普与就医参考，不替代面诊和处方。</div>
          <div id="doctorBio" class="output muted">读取中...</div>
          <div class="chips" id="focusTags"></div>
          <ul id="focusList" class="list"></ul>
          <div id="officialSources" class="links"></div>
        </div>
      </details>

      <!-- 输入区 -->
      <div class="chat-footer">
        <div id="voiceStatus" class="voice-hint"></div>
        <div class="input-row">
          <textarea id="message" class="chat-textarea" placeholder="输入问题…" rows="1"></textarea>
          <button id="askBtn" class="send-btn" title="发送">&#8593;</button>
        </div>
        <div class="aux-row">
          <button id="voiceInputBtn" class="aux-btn">&#127908; 语音</button>
          <button id="speakAnswerBtn" class="aux-btn">&#128266; 朗读</button>
          <button id="stopSpeechBtn" class="aux-btn">&#9209; 停止</button>
        </div>
      </div>
    </div>

    <!-- JS 兼容 IDs -->
    <div id="answer" style="display:none;"></div>
    <span id="doctorState" style="display:none;"></span>
    <span id="deptState" style="display:none;"></span>
    <span id="modeState" style="display:none;"></span>
    <span id="heroDescription" style="display:none;"></span>
    <span id="focusPrimary" style="display:none;"></span>
  </div>

  <script src="/static/user.js"></script>
</body>
</html>
