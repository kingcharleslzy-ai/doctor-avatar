<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>李勇医生 AI 医疗助手</title>
  <link rel="icon" href="/favicon.ico" />
  <script defer src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg-primary: #f0f4ff;
      --bg-secondary: #e8eef7;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-solid: #ffffff;
      --text: #1a2744;
      --muted: #5a6a8a;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.3);
      --accent-light: rgba(37, 99, 235, 0.1);
      --ai-color: #7c3aed;
      --ai-glow: rgba(124, 58, 237, 0.3);
      --success: #10b981;
      --line: rgba(26, 39, 68, 0.08);
      --warning-bg: rgba(255,246,234,0.96);
      --warning-line: rgba(193,123,47,0.18);
      --shadow: 0 8px 32px rgba(26, 39, 68, 0.08);
      --shadow-hover: 0 16px 48px rgba(26, 39, 68, 0.15);
      --radius-lg: 24px;
      --radius-md: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "SF Pro Display", -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, #e2e8f0 100%);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── 背景光晕 ── */
    .bg-decoration {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; overflow: hidden; z-index: 0;
    }
    .bg-orb {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: 0.5;
      animation: float 20s ease-in-out infinite;
    }
    .bg-orb-1 {
      width: 600px; height: 600px;
      background: linear-gradient(135deg, var(--accent-glow), var(--ai-glow));
      top: -200px; right: -100px;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      background: linear-gradient(135deg, var(--ai-glow), var(--accent-glow));
      bottom: -100px; left: -100px;
      animation-delay: -10s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(20px, 30px) scale(1.02); }
    }

    /* ── 主布局 ── */
    main {
      position: relative; z-index: 1;
      height: 100vh; padding: 20px;
      display: grid; grid-template-rows: auto 1fr;
      gap: 20px; max-width: 1400px; margin: 0 auto;
    }

    /* ── 顶栏 ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px;
      background: var(--surface);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: slideDown 0.6s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .logo {
      width: 52px; height: 52px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent) 0%, var(--ai-color) 100%);
      color: white; font-weight: 700; font-size: 20px;
      box-shadow: 0 4px 16px var(--accent-glow);
      animation: logoFloat 3s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .brand-text h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .brand-text p  { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .status-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 18px;
      background: linear-gradient(135deg, var(--accent-light), rgba(124, 58, 237, 0.1));
      border-radius: 999px; font-size: 13px; font-weight: 600;
      color: var(--accent);
      border: 1px solid rgba(37, 99, 235, 0.2);
    }
    .status-dot {
      width: 8px; height: 8px; background: var(--success);
      border-radius: 50%; animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    }

    /* ── 工作区双列 ── */
    .workspace {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 20px; min-height: 0;
      animation: fadeIn 0.8s ease-out 0.2s both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── 卡片基础 ── */
    .card {
      background: var(--surface);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.6);
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── 左：Avatar区域 ── */
    .avatar-card {
      display: flex; flex-direction: column;
    }
    .avatar-section {
      flex: 1; padding: 32px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; position: relative; overflow: hidden;
    }
    .avatar-section::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(37, 99, 235, 0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 50% 80%, rgba(124, 58, 237, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }
    .doctor-avatar-wrapper {
      position: relative;
      animation: avatarFloat 4s ease-in-out infinite;
    }
    @keyframes avatarFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .avatar-glow {
      position: absolute; inset: -20px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      animation: glowPulse 3s ease-in-out infinite; z-index: 0;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.1); }
    }

    /* video-stage 区域（LiveKit 视频接入时覆盖 avatar） */
    .video-stage {
      position: relative; width: 200px; height: 200px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(26, 39, 68, 0.12),
                  0 0 0 8px rgba(255, 255, 255, 0.8),
                  inset 0 2px 8px rgba(255, 255, 255, 0.9);
      z-index: 1; overflow: hidden;
    }
    .video-stage svg { width: 150px; height: 150px; }
    .video-stage video, .video-stage canvas {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: 50%;
    }
    .online-indicator {
      position: absolute; bottom: 16px; right: 16px;
      width: 24px; height: 24px;
      background: var(--success); border-radius: 50%;
      border: 4px solid var(--surface-solid);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
      animation: onlinePulse 2s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes onlinePulse {
      0%, 100% { box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 2px 16px rgba(16, 185, 129, 0.6), 0 0 0 4px rgba(16, 185, 129, 0.2); }
    }
    .doctor-info { text-align: center; position: relative; z-index: 1; }
    .doctor-name {
      font-size: 26px; font-weight: 700;
      color: var(--text); margin-bottom: 4px; letter-spacing: -0.02em;
    }
    .doctor-title {
      font-size: 15px; color: var(--muted); margin-bottom: 10px;
    }
    .hospital-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--accent-light), rgba(124, 58, 237, 0.08));
      border-radius: 999px; color: var(--accent);
      font-size: 14px; font-weight: 600;
      border: 1px solid rgba(37, 99, 235, 0.15);
    }

    /* 按钮区 */
    .action-bar {
      padding: 16px 24px;
      border-top: 1px solid var(--line);
      display: flex; flex-direction: column; gap: 12px;
      position: relative; z-index: 1;
    }
    .conn-status {
      display: flex; align-items: center; gap: 7px;
      color: var(--muted); font-size: 13px;
    }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #9ca3af; flex-shrink: 0;
      transition: background 0.3s;
    }
    .conn-dot.live { background: var(--success); }

    /* 开始问诊按钮：大且醒目 */
    .start-consult-btn {
      width: 100%; padding: 16px 32px;
      border: none; border-radius: var(--radius-md);
      font-size: 17px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .start-consult-btn::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
      pointer-events: none;
    }
    .start-consult-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .start-consult-btn:active {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .start-consult-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* 结束问诊按钮 */
    .end-consult-btn {
      width: 100%; padding: 14px 32px;
      border: none; border-radius: var(--radius-md);
      font-size: 15px; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      /* visibility controlled by inline style */
      align-items: center; justify-content: center; gap: 10px;
    }
    .end-consult-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
    }
    .end-consult-btn:active { transform: translateY(0); }

    .aux-action-row {
      display: flex; gap: 8px;
    }
    .aux-action-btn {
      flex: 1; padding: 10px 16px;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      color: var(--text); font-size: 13px; font-weight: 500;
      cursor: pointer; text-align: center;
      transition: all 0.2s;
      display: none; /* hidden by default */
    }
    .aux-action-btn:hover { background: #f8fafc; }

    /* ── 右：聊天区 ── */
    .chat-card {
      display: flex; flex-direction: column;
    }
    .chat-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
    }
    .chat-header h2 { font-size: 18px; font-weight: 600; }
    .chat-model-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.1), rgba(37, 99, 235, 0.08));
      border-radius: 999px; font-size: 12px; font-weight: 600;
      color: var(--ai-color);
      border: 1px solid rgba(124, 58, 237, 0.15);
    }
    .chat-history {
      flex: 1; overflow-y: auto;
      padding: 24px; display: flex;
      flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    .chat-history::-webkit-scrollbar { width: 6px; }
    .chat-history::-webkit-scrollbar-track { background: transparent; }
    .chat-history::-webkit-scrollbar-thumb {
      background: rgba(26, 39, 68, 0.15); border-radius: 3px;
    }

    /* 消息 */
    .msg-row { display: flex; flex-direction: column; animation: messageIn 0.4s ease-out; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.ai   { align-items: flex-start; }
    @keyframes messageIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ai-label {
      font-size: 11px; font-weight: 600; color: var(--ai-color);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px;
    }
    .bubble {
      max-width: 85%; font-size: 14px; line-height: 1.72;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%);
      color: #fff; padding: 12px 18px;
      border-radius: 20px 20px 4px 20px;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .msg-row.ai .bubble {
      max-width: 100%; color: var(--text); padding: 0;
    }
    .typing-dots {
      display: inline-flex; gap: 5px; padding: 12px 16px;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      border-radius: 20px 20px 20px 4px;
    }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%,100% { transform: translateY(0); opacity: 0.4; }
      50%      { transform: translateY(-5px); opacity: 1; }
    }

    /* 快捷提问 */
    .quick-prompts {
      padding: 0 24px 12px;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .prompt-pill {
      padding: 8px 16px; border-radius: 999px;
      background: linear-gradient(135deg, var(--accent-light), rgba(124, 58, 237, 0.06));
      border: 1px solid rgba(37, 99, 235, 0.15);
      color: var(--accent); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
    }
    .prompt-pill:hover {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.15), rgba(124, 58, 237, 0.1));
      transform: translateY(-1px);
    }

    /* 医生信息折叠 */
    .details-section {
      border-top: 1px solid var(--line); overflow: hidden;
    }
    .details-section summary {
      padding: 14px 24px; cursor: pointer; list-style: none;
      font-size: 14px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
      user-select: none;
    }
    .details-section summary::-webkit-details-marker { display: none; }
    .details-section summary::after {
      content: "\203A"; color: var(--muted); font-size: 18px;
      transition: transform 0.2s;
    }
    .details-section[open] summary::after { transform: rotate(90deg); }
    .details-body {
      padding: 0 24px 16px; border-top: 1px solid var(--line);
      display: grid; gap: 12px;
      max-height: 220px; overflow-y: auto;
    }
    .notice {
      padding: 10px 14px; border-radius: 14px;
      background: var(--warning-bg); border: 1px solid var(--warning-line);
      color: #7c5a2f; font-size: 12px; line-height: 1.8;
    }
    .output { font-size: 13px; line-height: 1.85; white-space: pre-wrap; }
    .muted { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 5px 12px; border-radius: 999px;
      background: var(--accent-light);
      border: 1px solid rgba(37, 99, 235, 0.12);
      color: var(--accent); font-size: 11px; font-weight: 500;
    }
    .list {
      margin: 0; padding-left: 18px;
      color: var(--muted); font-size: 13px; line-height: 1.85;
    }
    .links { display: grid; gap: 6px; }
    .links a {
      color: var(--accent); text-decoration: none;
      font-size: 13px; word-break: break-word;
    }

    /* ── 输入区 ── */
    .chat-footer {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--line);
      display: grid; gap: 10px;
      background: rgba(248, 250, 252, 0.5);
    }
    .voice-hint { font-size: 12px; color: var(--muted); min-height: 14px; }
    .input-row {
      display: flex; align-items: flex-end; gap: 10px;
    }
    .chat-textarea {
      flex: 1; padding: 14px 20px;
      border: 1px solid var(--line); border-radius: var(--radius-md);
      background: var(--surface-solid); color: var(--text);
      font: inherit; font-size: 14px; line-height: 1.5;
      resize: none; outline: none;
      min-height: 22px; max-height: 110px; overflow-y: auto;
      transition: all 0.3s ease;
    }
    .chat-textarea::placeholder { color: var(--muted); }
    .chat-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-light);
    }
    .send-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%);
      color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 20px; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
    .send-btn:active { transform: translateY(0); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .aux-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .aux-btn {
      min-height: 36px; padding: 0 14px;
      border-radius: 999px;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      color: var(--muted); font-size: 12px;
      display: flex; align-items: center; gap: 5px;
      cursor: pointer; transition: all 0.2s;
    }
    .aux-btn:hover { background: #f8fafc; }
    .aux-btn:active { opacity: 0.72; transform: scale(0.96); }
    .aux-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── 按钮基础 ── */
    button {
      border: 0; cursor: pointer; font: inherit;
      transition: opacity 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    /* danger */
    .danger-aux {
      color: #8f4141;
      background: rgba(165,76,76,0.07);
      border-color: rgba(165,76,76,0.14);
    }

    /* ── 全局滚动条 ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(26, 39, 68, 0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(26, 39, 68, 0.25); }
  </style>
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-decoration">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>

  <main>
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">LY</div>
        <div class="brand-text">
          <h1>李勇医生 AI 医疗助手</h1>
          <p id="brandSubtitle">杭州市第一人民医院 · 耳鼻咽喉科</p>
        </div>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        仅供健康科普与就医参考
      </div>
    </header>

    <div class="workspace">
      <!-- 左：Avatar + 操作 -->
      <div class="card avatar-card">
        <div class="avatar-section">
          <div class="doctor-avatar-wrapper">
            <div class="avatar-glow"></div>
            <div class="video-stage" id="videoStage">
              <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="32" r="18" fill="#cbd5e1"/>
                <path d="M24 82c0-14.359 11.641-26 26-26s26 11.641 26 26" fill="#cbd5e1"/>
                <circle cx="42" cy="30" r="2.5" fill="#64748b"/>
                <circle cx="58" cy="30" r="2.5" fill="#64748b"/>
                <path d="M44 38c1.5 1.5 7.5 1.5 12 0" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M32 52h36v4c0 8-6 14-14 18-8-4-14-10-14-18v-4z" fill="#2563eb" opacity="0.8"/>
                <path d="M38 52v20" stroke="#1d4ed8" stroke-width="1.5"/>
                <path d="M50 52v22" stroke="#1d4ed8" stroke-width="1.5"/>
                <path d="M62 52v18" stroke="#1d4ed8" stroke-width="1.5"/>
              </svg>
            </div>
            <div class="online-indicator"></div>
          </div>

          <div class="doctor-info">
            <h2 class="doctor-name" id="heroTitle">李勇医生</h2>
            <p class="doctor-title"><span id="deptState">耳鼻咽喉科</span> · <span id="focusPrimary">鼻科微创与头颈肿瘤</span></p>
            <span class="hospital-badge">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
              <span id="hospitalValue">杭州市第一人民医院</span>
            </span>
          </div>
        </div>

        <!-- 操作区 -->
        <div class="action-bar">
          <div class="conn-status">
            <span class="conn-dot" id="connDot"></span>
            <span id="connectionState">未启用</span>
          </div>
          <button id="startConsultBtn" class="start-consult-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
            开始问诊
          </button>
          <button id="endConsultBtn" class="end-consult-btn" style="display:none">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
            结束问诊
          </button>
          <div class="aux-action-row">
            <button id="keepAliveBtn" class="aux-action-btn" style="display:none">保持会话</button>
            <button id="disconnectBtn" class="aux-action-btn danger-aux" style="display:none">断开连接</button>
          </div>
        </div>
      </div>

      <!-- 右：聊天 -->
      <div class="card chat-card">
        <div class="chat-header">
          <h2>AI 医疗助手</h2>
          <span class="chat-model-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
            AI 助手
          </span>
        </div>

        <div id="chatHistory" class="chat-history">
          <div class="msg-row ai">
            <div class="ai-label">AI 医疗助手</div>
            <div class="bubble">您好，我是李勇医生的 AI 助手，专注耳鼻咽喉科常见问题的健康科普与就医建议。请问有什么可以帮您？</div>
          </div>
        </div>

        <div id="quickPrompts" class="quick-prompts"></div>

        <!-- 医生信息折叠 -->
        <details class="details-section">
          <summary>医生信息与资料来源</summary>
          <div class="details-body">
            <div class="notice" id="clinicNote">提醒：仅供健康科普与就医参考，不替代面诊和处方。</div>
            <div id="doctorBio" class="output muted">读取中...</div>
            <div class="chips" id="focusTags"></div>
            <ul id="focusList" class="list"></ul>
            <div id="officialSources" class="links"></div>
          </div>
        </details>

        <!-- 输入区 -->
        <div class="chat-footer">
          <div id="voiceStatus" class="voice-hint"></div>
          <div class="input-row">
            <textarea id="message" class="chat-textarea" placeholder="输入问题，Ctrl+Enter 发送…" rows="1"></textarea>
            <button id="askBtn" class="send-btn" title="发送">&#8593;</button>
          </div>
          <div class="aux-row">
            <button id="voiceInputBtn" class="aux-btn">&#127908; 语音</button>
            <button id="speakAnswerBtn" class="aux-btn">&#128266; 朗读</button>
            <button id="stopSpeechBtn" class="aux-btn">&#9209; 停止</button>
          </div>
        </div>

        <!-- JS 兼容 IDs -->
        <div id="answer" style="display:none;"></div>
        <span id="doctorState" style="display:none;"></span>
        <span id="modeState" style="display:none;"></span>
        <span id="heroDescription" style="display:none;"></span>
      </div>
    </div>
  </main>

  <script src="/static/user.js?v={{ v }}"></script>
</body>
</html>
