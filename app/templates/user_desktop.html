<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>李勇医生 AI 医疗助手</title>
  <script defer src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: rgba(255,255,255,0.92);
      --line: rgba(17,24,39,0.08);
      --text: #111824;
      --muted: #61707d;
      --accent: #0f766e;
      --ai: #215dff;
      --warning-bg: rgba(255,246,234,0.96);
      --warning-line: rgba(193,123,47,0.18);
      --shadow: 0 8px 28px rgba(15,23,42,0.09);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--text);
      font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      background: linear-gradient(180deg, #fafbfd 0%, #eef2f5 100%);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    /* ── 布局 ── */
    main {
      height: 100vh;
      padding: 12px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) 380px;
      gap: 12px;
      min-height: 0;
    }

    /* ── 顶栏 ── */
    .topbar {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 40px; height: 40px;
      border-radius: 14px;
      display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 14px;
      background: linear-gradient(135deg, var(--text) 0%, var(--ai) 100%);
      flex-shrink: 0;
    }
    .brand h1 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
    .brand p  { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .topbar-chips { display: flex; gap: 8px; }
    .top-chip {
      padding: 7px 12px; border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--muted); font-size: 11px;
    }

    /* ── 左侧：视频卡片 ── */
    .video-card {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }
    .video-stage {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(124,226,218,0.2), transparent 22%),
        radial-gradient(circle at 85% 10%, rgba(33,93,255,0.18), transparent 24%),
        linear-gradient(180deg, #121a25 0%, #0a1118 100%);
    }
    .video-stage::after {
      content: "";
      position: absolute; inset: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }
    .video-stage > * { width: 100%; height: 100%; }

    /* 视频占位符 */
    .video-placeholder {
      position: absolute; inset: 0; padding: 20px;
      display: flex; flex-direction: column; justify-content: flex-end;
      color: rgba(240,247,249,0.96);
    }
    .portrait-panel {
      border-radius: 18px; padding: 18px 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
      border: 1px solid rgba(255,255,255,0.08);
    }
    .portrait-panel .badge {
      display: inline-flex; padding: 4px 10px; border-radius: 999px;
      background: rgba(124,226,218,0.14); color: #a3f1ec;
      border: 1px solid rgba(124,226,218,0.14);
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .portrait-panel .name {
      margin-top: 10px; font-size: 32px; font-weight: 700;
      letter-spacing: -0.04em;
    }
    .portrait-panel .meta {
      margin-top: 4px; color: rgba(240,247,249,0.7);
      line-height: 1.6; font-size: 13px;
    }

    .video-bar {
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border-top: 1px solid var(--line);
    }
    .conn-status {
      display: flex; align-items: center; gap: 7px;
      color: var(--muted); font-size: 13px;
    }
    .conn-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #9ca3af; flex-shrink: 0;
      transition: background 0.3s;
    }
    .conn-dot.live { background: #22c55e; }
    .video-actions { display: flex; gap: 8px; align-items: center; }

    /* ── 右侧：聊天卡片 ── */
    .chat-card {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      overflow: hidden;
    }
    .chat-history {
      overflow-y: auto;
      padding: 18px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    .chat-history::-webkit-scrollbar { width: 6px; }
    .chat-history::-webkit-scrollbar-thumb {
      background: rgba(17,24,39,0.1); border-radius: 999px;
    }
    .msg-row { display: flex; flex-direction: column; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.ai   { align-items: flex-start; }
    .ai-label {
      font-size: 11px; font-weight: 600; color: var(--accent);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px;
    }
    .bubble {
      max-width: 85%; font-size: 14px; line-height: 1.72;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg-row.user .bubble {
      background: var(--text); color: #fff;
      padding: 10px 15px;
      border-radius: 18px 18px 4px 18px;
    }
    .msg-row.ai .bubble {
      max-width: 100%; color: var(--text); padding: 0;
    }
    .typing-dots {
      display: inline-flex; gap: 5px;
      padding: 10px 14px;
      background: rgba(17,24,39,0.06);
      border-radius: 18px 18px 18px 4px;
    }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%,100% { transform: translateY(0); opacity: 0.4; }
      50%      { transform: translateY(-5px); opacity: 1; }
    }

    /* 医生信息折叠 */
    .details-section {
      border-top: 1px solid var(--line);
      overflow: hidden;
    }
    .details-section summary {
      padding: 13px 18px;
      cursor: pointer; list-style: none;
      font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
      display: flex; justify-content: space-between; align-items: center;
      user-select: none;
    }
    .details-section summary::-webkit-details-marker { display: none; }
    .details-section summary::after {
      content: "›"; color: var(--muted); font-size: 18px;
      transition: transform 0.2s;
    }
    .details-section[open] summary::after { transform: rotate(90deg); }
    .details-body {
      padding: 0 18px 14px;
      border-top: 1px solid var(--line);
      display: grid; gap: 12px;
      max-height: 220px; overflow-y: auto;
    }
    .notice {
      padding: 10px 14px; border-radius: 14px;
      background: var(--warning-bg); border: 1px solid var(--warning-line);
      color: #7c5a2f; font-size: 12px; line-height: 1.8;
    }
    .output { font-size: 13px; line-height: 1.85; white-space: pre-wrap; }
    .muted { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 5px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.88); border: 1px solid var(--line);
      color: #33424f; font-size: 11px;
    }
    .list {
      margin: 0; padding-left: 18px;
      color: var(--muted); font-size: 13px; line-height: 1.85;
    }
    .links { display: grid; gap: 6px; }
    .links a {
      color: var(--accent); text-decoration: none;
      font-size: 13px; word-break: break-word;
    }

    /* ── 输入区 ── */
    .chat-footer {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--line);
      display: grid; gap: 9px;
    }
    .voice-hint { font-size: 12px; color: var(--muted); min-height: 14px; }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 8px 8px 8px 14px;
      box-shadow: 0 2px 6px rgba(15,23,42,0.05);
    }
    .chat-textarea {
      flex: 1; border: none; background: transparent;
      color: var(--text); font: inherit;
      font-size: 14px; line-height: 1.5;
      resize: none; outline: none;
      min-height: 22px; max-height: 110px; overflow-y: auto;
    }
    .chat-textarea::placeholder { color: var(--muted); }

    /* ── 按钮 ── */
    button {
      border: 0; cursor: pointer; font: inherit;
      transition: opacity 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active  { opacity: 0.72; transform: scale(0.96); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--text); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 18px; font-weight: 700;
    }
    .aux-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .aux-btn {
      min-height: 34px; padding: 0 13px;
      border-radius: 999px;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--line);
      color: var(--muted); font-size: 12px;
      display: flex; align-items: center; gap: 5px;
    }
    .video-btn {
      background: rgba(33,93,255,0.1);
      border: 1px solid rgba(33,93,255,0.2);
      color: var(--ai);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px; font-weight: 500;
      min-height: 36px;
    }
    .danger-aux {
      color: #8f4141;
      background: rgba(165,76,76,0.07);
      border-color: rgba(165,76,76,0.14);
    }
  </style>
</head>
<body>
  <main>
    <!-- 顶栏 -->
    <header class="card topbar">
      <div class="brand">
        <div class="logo">LY</div>
        <div>
          <h1>李勇医生 AI 医疗助手</h1>
          <p id="brandSubtitle">杭州市第一人民医院 · 耳鼻咽喉科</p>
        </div>
      </div>
      <div class="topbar-chips">
        <div class="top-chip">仅供健康科普与就医参考</div>
      </div>
    </header>

    <div class="workspace">
      <!-- 左：视频 -->
      <article class="card video-card">
        <div class="video-stage" id="videoStage">
          <div class="video-placeholder">
            <div class="portrait-panel">
              <div class="badge">AI AVATAR · STANDBY</div>
              <div class="name" id="doctorState">李勇医生</div>
              <div class="meta" id="heroDescription">
                <span id="hospitalValue">杭州市第一人民医院</span> · 耳鼻咽喉科<br>
                <span id="focusPrimary">鼻科微创与头颈肿瘤</span>
              </div>
            </div>
          </div>
        </div>
        <div class="video-bar">
          <div class="conn-status">
            <span class="conn-dot" id="connDot"></span>
            <span id="connectionState">未启用</span>
          </div>
          <div class="video-actions">
            <button id="keepAliveBtn" class="aux-btn" style="display:none">保持会话</button>
            <button id="disconnectBtn" class="aux-btn danger-aux" style="display:none">断开</button>
            <button id="startConsultBtn" class="video-btn">视频分身</button>
          </div>
        </div>
      </article>

      <!-- 右：聊天 -->
      <aside class="card chat-card">
        <div id="chatHistory" class="chat-history">
          <div class="msg-row ai">
            <div class="ai-label">AI 医疗助手</div>
            <div class="bubble">您好，我是李勇医生的 AI 助手，专注耳鼻咽喉科常见问题的健康科普与就医建议。请问有什么可以帮您？</div>
          </div>
        </div>

        <!-- 医生信息折叠 -->
        <details class="details-section">
          <summary>医生信息与资料来源</summary>
          <div class="details-body">
            <div class="notice" id="clinicNote">提醒：仅供健康科普与就医参考，不替代面诊和处方。</div>
            <div id="doctorBio" class="output muted">读取中...</div>
            <div class="chips" id="focusTags"></div>
            <ul id="focusList" class="list"></ul>
            <div id="officialSources" class="links"></div>
          </div>
        </details>

        <!-- 输入区 -->
        <div class="chat-footer">
          <div id="voiceStatus" class="voice-hint"></div>
          <div class="input-row">
            <textarea id="message" class="chat-textarea" placeholder="输入问题，Ctrl+Enter 发送…" rows="1"></textarea>
            <button id="askBtn" class="send-btn" title="发送">↑</button>
          </div>
          <div class="aux-row">
            <button id="voiceInputBtn" class="aux-btn">🎤 语音</button>
            <button id="speakAnswerBtn" class="aux-btn">🔊 朗读</button>
            <button id="stopSpeechBtn" class="aux-btn">⏹ 停止</button>
          </div>
        </div>

        <!-- JS 兼容 IDs -->
        <div id="answer" style="display:none;"></div>
        <span id="heroTitle" style="display:none;"></span>
        <span id="modeState" style="display:none;"></span>
        <span id="deptState" style="display:none;"></span>
      </aside>
    </div>
  </main>
  <script src="/static/user.js"></script>
</body>
</html>
