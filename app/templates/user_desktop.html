<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>李勇医生 AI 医疗助手</title>
  <script defer src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: rgba(255,255,255,0.92);
      --line: rgba(17,24,39,0.08);
      --text: #111824;
      --muted: #61707d;
      --accent: #0f766e;
      --ai: #215dff;
      --warning-bg: rgba(255,246,234,0.96);
      --warning-line: rgba(193,123,47,0.18);
      --shadow: 0 8px 28px rgba(15,23,42,0.09);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--text);
      font-family: "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      background: linear-gradient(180deg, #fafbfd 0%, #eef2f5 100%);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    /* ── 布局 ── */
    main {
      height: 100vh;
      padding: 12px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) 380px;
      gap: 12px;
      min-height: 0;
    }

    /* ── 顶栏 ── */
    .topbar {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 40px; height: 40px;
      border-radius: 14px;
      display: grid; place-items: center;
      color: #fff; font-weight: 700; font-size: 14px;
      background: linear-gradient(135deg, var(--text) 0%, var(--ai) 100%);
      flex-shrink: 0;
    }
    .brand h1 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
    .brand p  { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .topbar-chips { display: flex; gap: 8px; }
    .top-chip {
      padding: 7px 12px; border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--muted); font-size: 11px;
    }

    /* ── 左侧：视频卡片 ── */
    .video-card {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      overflow: hidden;
    }
    .video-stage {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(124,226,218,0.2), transparent 22%),
        radial-gradient(circle at 85% 10%, rgba(33,93,255,0.18), transparent 24%),
        linear-gradient(180deg, #121a25 0%, #0a1118 100%);
    }
    .video-stage::after {
      content: "";
      position: absolute; inset: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }
    .video-stage > * { width: 100%; height: 100%; }

    /* ── 头像占位 ── */
    .avatar-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .avatar-wrap svg { width: 100%; height: 100%; }
    .avatar-info {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 36px 20px 16px;
      background: linear-gradient(0deg, rgba(8,14,22,0.88) 0%, rgba(8,14,22,0.5) 55%, transparent 100%);
      color: rgba(240,247,249,0.96);
    }
    .av-badge {
      display: inline-flex; padding: 4px 10px; border-radius: 999px;
      background: rgba(124,226,218,0.14); color: #a3f1ec;
      border: 1px solid rgba(124,226,218,0.16);
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .av-name { margin-top: 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.04em; }
    .av-meta { margin-top: 4px; color: rgba(240,247,249,0.7); font-size: 13px; line-height: 1.6; }

    .video-bar {
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border-top: 1px solid var(--line);
    }
    .conn-status {
      display: flex; align-items: center; gap: 7px;
      color: var(--muted); font-size: 13px;
    }
    .conn-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #9ca3af; flex-shrink: 0;
      transition: background 0.3s;
    }
    .conn-dot.live { background: #22c55e; }
    .video-actions { display: flex; gap: 8px; align-items: center; }

    /* ── 右侧：聊天卡片 ── */
    .chat-card {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      overflow: hidden;
    }
    .chat-history {
      overflow-y: auto;
      padding: 18px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    .chat-history::-webkit-scrollbar { width: 6px; }
    .chat-history::-webkit-scrollbar-thumb {
      background: rgba(17,24,39,0.1); border-radius: 999px;
    }
    .msg-row { display: flex; flex-direction: column; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.ai   { align-items: flex-start; }
    .ai-label {
      font-size: 11px; font-weight: 600; color: var(--accent);
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px;
    }
    .bubble {
      max-width: 85%; font-size: 14px; line-height: 1.72;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg-row.user .bubble {
      background: var(--text); color: #fff;
      padding: 10px 15px;
      border-radius: 18px 18px 4px 18px;
    }
    .msg-row.ai .bubble {
      max-width: 100%; color: var(--text); padding: 0;
    }
    .typing-dots {
      display: inline-flex; gap: 5px;
      padding: 10px 14px;
      background: rgba(17,24,39,0.06);
      border-radius: 18px 18px 18px 4px;
    }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); animation: tdot 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes tdot {
      0%,100% { transform: translateY(0); opacity: 0.4; }
      50%      { transform: translateY(-5px); opacity: 1; }
    }

    /* 医生信息折叠 */
    .details-section {
      border-top: 1px solid var(--line);
      overflow: hidden;
    }
    .details-section summary {
      padding: 13px 18px;
      cursor: pointer; list-style: none;
      font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
      display: flex; justify-content: space-between; align-items: center;
      user-select: none;
    }
    .details-section summary::-webkit-details-marker { display: none; }
    .details-section summary::after {
      content: "›"; color: var(--muted); font-size: 18px;
      transition: transform 0.2s;
    }
    .details-section[open] summary::after { transform: rotate(90deg); }
    .details-body {
      padding: 0 18px 14px;
      border-top: 1px solid var(--line);
      display: grid; gap: 12px;
      max-height: 220px; overflow-y: auto;
    }
    .notice {
      padding: 10px 14px; border-radius: 14px;
      background: var(--warning-bg); border: 1px solid var(--warning-line);
      color: #7c5a2f; font-size: 12px; line-height: 1.8;
    }
    .output { font-size: 13px; line-height: 1.85; white-space: pre-wrap; }
    .muted { color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 5px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.88); border: 1px solid var(--line);
      color: #33424f; font-size: 11px;
    }
    .list {
      margin: 0; padding-left: 18px;
      color: var(--muted); font-size: 13px; line-height: 1.85;
    }
    .links { display: grid; gap: 6px; }
    .links a {
      color: var(--accent); text-decoration: none;
      font-size: 13px; word-break: break-word;
    }

    /* ── 输入区 ── */
    .chat-footer {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--line);
      display: grid; gap: 9px;
    }
    .voice-hint { font-size: 12px; color: var(--muted); min-height: 14px; }
    .input-row {
      display: flex; align-items: flex-end; gap: 8px;
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 8px 8px 8px 14px;
      box-shadow: 0 2px 6px rgba(15,23,42,0.05);
    }
    .chat-textarea {
      flex: 1; border: none; background: transparent;
      color: var(--text); font: inherit;
      font-size: 14px; line-height: 1.5;
      resize: none; outline: none;
      min-height: 22px; max-height: 110px; overflow-y: auto;
    }
    .chat-textarea::placeholder { color: var(--muted); }

    /* ── 按钮 ── */
    button {
      border: 0; cursor: pointer; font: inherit;
      transition: opacity 0.15s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    button:active  { opacity: 0.72; transform: scale(0.96); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--text); color: #fff; border: none;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 18px; font-weight: 700;
    }
    .aux-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .aux-btn {
      min-height: 34px; padding: 0 13px;
      border-radius: 999px;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--line);
      color: var(--muted); font-size: 12px;
      display: flex; align-items: center; gap: 5px;
    }
    .video-btn {
      background: rgba(33,93,255,0.1);
      border: 1px solid rgba(33,93,255,0.2);
      color: var(--ai);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px; font-weight: 500;
      min-height: 36px;
    }
    .danger-aux {
      color: #8f4141;
      background: rgba(165,76,76,0.07);
      border-color: rgba(165,76,76,0.14);
    }
  </style>
</head>
<body>
  <main>
    <!-- 顶栏 -->
    <header class="card topbar">
      <div class="brand">
        <div class="logo">LY</div>
        <div>
          <h1>李勇医生 AI 医疗助手</h1>
          <p id="brandSubtitle">杭州市第一人民医院 · 耳鼻咽喉科</p>
        </div>
      </div>
      <div class="topbar-chips">
        <div class="top-chip">仅供健康科普与就医参考</div>
      </div>
    </header>

    <div class="workspace">
      <!-- 左：视频 -->
      <article class="card video-card">
        <div class="video-stage" id="videoStage">
          <div class="avatar-wrap">
            <svg viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
              <defs>
                <radialGradient id="avH" cx="38%" cy="30%" r="62%"><stop offset="0%" stop-color="#dce9f0"/><stop offset="100%" stop-color="#96afc0"/></radialGradient>
                <radialGradient id="avC" cx="28%" cy="20%" r="72%"><stop offset="0%" stop-color="#edf4f8"/><stop offset="100%" stop-color="#bccedd"/></radialGradient>
                <linearGradient id="avR" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7ce0d7"/><stop offset="100%" stop-color="#4b7cff"/></linearGradient>
                <filter id="avG"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              </defs>
              <!-- 脉冲环 -->
              <circle cx="180" cy="175" r="90" fill="none" stroke="url(#avR)" stroke-width="1.2" opacity="0.3"><animate attributeName="r" values="88;102;88" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.08;0.3" dur="3s" repeatCount="indefinite"/></circle>
              <circle cx="180" cy="175" r="112" fill="none" stroke="url(#avR)" stroke-width="0.7" opacity="0.14"><animate attributeName="r" values="110;128;110" dur="3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.14;0.03;0.14" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
              <!-- 白大褂 -->
              <path d="M93 318 C88 278 108 255 138 248 L162 316 L198 316 L222 248 C252 255 272 278 267 318 L267 450 L93 450Z" fill="url(#avC)"/>
              <path d="M138 248 L162 316 L162 450 L110 450 L110 295 Q116 265 138 248Z" fill="rgba(0,0,0,0.055)"/>
              <path d="M222 248 L198 316 L198 450 L250 450 L250 295 Q244 265 222 248Z" fill="rgba(0,0,0,0.055)"/>
              <path d="M154 252 L162 316 L198 316 L206 252 L180 268Z" fill="rgba(255,255,255,0.3)"/>
              <!-- 脖子 -->
              <rect x="165" y="208" width="30" height="46" rx="13" fill="url(#avH)"/>
              <!-- 头 -->
              <ellipse cx="180" cy="170" rx="55" ry="59" fill="url(#avH)"/>
              <ellipse cx="162" cy="172" rx="18" ry="50" fill="rgba(0,0,0,0.05)"/>
              <!-- 头发 -->
              <path d="M125 158 Q127 104 180 99 Q233 104 235 158 Q226 124 180 122 Q134 124 125 158Z" fill="#22303e" opacity="0.88"/>
              <path d="M144 111 Q170 103 196 106" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="2.5" stroke-linecap="round"/>
              <!-- 耳朵 -->
              <ellipse cx="125" cy="173" rx="10" ry="14" fill="url(#avH)"/>
              <ellipse cx="235" cy="173" rx="10" ry="14" fill="url(#avH)"/>
              <!-- 眼睛 -->
              <ellipse cx="160" cy="165" rx="9" ry="10" fill="#1b2b3a"/>
              <ellipse cx="200" cy="165" rx="9" ry="10" fill="#1b2b3a"/>
              <circle cx="160" cy="165" r="5" fill="#2d4868"/>
              <circle cx="200" cy="165" r="5" fill="#2d4868"/>
              <circle cx="162" cy="162" r="2.8" fill="white" opacity="0.88"/>
              <circle cx="202" cy="162" r="2.8" fill="white" opacity="0.88"/>
              <!-- 眉毛 -->
              <path d="M150 151 Q160 147 170 150" fill="none" stroke="#22303e" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M190 150 Q200 147 210 151" fill="none" stroke="#22303e" stroke-width="2.2" stroke-linecap="round"/>
              <!-- 鼻 -->
              <path d="M176 177 Q180 186 184 177" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.6" stroke-linecap="round"/>
              <!-- 嘴 -->
              <path d="M166 192 Q180 202 194 192" fill="none" stroke="rgba(50,75,90,0.48)" stroke-width="2" stroke-linecap="round"/>
              <!-- 听诊器 -->
              <path d="M148 258 Q136 276 134 298 Q132 316 143 326 Q155 338 167 326 Q179 314 175 298" fill="none" stroke="#7ce0d7" stroke-width="4" stroke-linecap="round" filter="url(#avG)"/>
              <circle cx="175" cy="296" r="10" fill="none" stroke="#7ce0d7" stroke-width="3.5" filter="url(#avG)"/>
              <circle cx="175" cy="296" r="4.5" fill="#7ce0d7" opacity="0.38"/>
              <path d="M148 258 Q150 244 158 240 Q166 236 170 244" fill="none" stroke="#7ce0d7" stroke-width="3" stroke-linecap="round"/>
              <circle cx="148" cy="258" r="4.5" fill="#7ce0d7" opacity="0.62"/>
              <circle cx="170" cy="244" r="4.5" fill="#7ce0d7" opacity="0.62"/>
              <!-- 口袋+医疗十字 -->
              <rect x="204" y="276" width="40" height="34" rx="7" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
              <rect x="219" y="283" width="10" height="20" rx="3" fill="#7ce0d7" opacity="0.76"/>
              <rect x="213" y="289" width="22" height="8" rx="3" fill="#7ce0d7" opacity="0.76"/>
              <!-- 漂浮粒子 -->
              <circle cx="95" cy="138" r="3.5" fill="#7ce0d7" opacity="0.5" filter="url(#avG)"><animate attributeName="cy" values="138;124;138" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.14;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
              <circle cx="270" cy="158" r="2.5" fill="#4b7cff" opacity="0.44" filter="url(#avG)"><animate attributeName="cy" values="158;143;158" dur="3.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.44;0.11;0.44" dur="3.3s" repeatCount="indefinite"/></circle>
              <circle cx="76" cy="245" r="3" fill="#7ce0d7" opacity="0.36"><animate attributeName="cy" values="245;229;245" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.36;0.09;0.36" dur="3s" repeatCount="indefinite"/></circle>
              <circle cx="284" cy="224" r="2" fill="#a3f1ec" opacity="0.4"><animate attributeName="cy" values="224;208;224" dur="3.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.9s" repeatCount="indefinite"/></circle>
              <circle cx="314" cy="310" r="2.5" fill="#4b7cff" opacity="0.26"><animate attributeName="cy" values="310;294;310" dur="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.26;0.06;0.26" dur="2.9s" repeatCount="indefinite"/></circle>
            </svg>
            <div class="avatar-info">
              <div class="av-badge">AI AVATAR · STANDBY</div>
              <div class="av-name" id="doctorState">李勇医生</div>
              <div class="av-meta" id="heroDescription">
                <span id="hospitalValue">杭州市第一人民医院</span> · 耳鼻咽喉科 · <span id="focusPrimary">鼻科微创与头颈肿瘤</span>
              </div>
            </div>
          </div>
        </div>
        <div class="video-bar">
          <div class="conn-status">
            <span class="conn-dot" id="connDot"></span>
            <span id="connectionState">未启用</span>
          </div>
          <div class="video-actions">
            <button id="keepAliveBtn" class="aux-btn" style="display:none">保持会话</button>
            <button id="disconnectBtn" class="aux-btn danger-aux" style="display:none">断开</button>
            <button id="startConsultBtn" class="video-btn">视频分身</button>
          </div>
        </div>
      </article>

      <!-- 右：聊天 -->
      <aside class="card chat-card">
        <div id="chatHistory" class="chat-history">
          <div class="msg-row ai">
            <div class="ai-label">AI 医疗助手</div>
            <div class="bubble">您好，我是李勇医生的 AI 助手，专注耳鼻咽喉科常见问题的健康科普与就医建议。请问有什么可以帮您？</div>
          </div>
        </div>

        <!-- 医生信息折叠 -->
        <details class="details-section">
          <summary>医生信息与资料来源</summary>
          <div class="details-body">
            <div class="notice" id="clinicNote">提醒：仅供健康科普与就医参考，不替代面诊和处方。</div>
            <div id="doctorBio" class="output muted">读取中...</div>
            <div class="chips" id="focusTags"></div>
            <ul id="focusList" class="list"></ul>
            <div id="officialSources" class="links"></div>
          </div>
        </details>

        <!-- 输入区 -->
        <div class="chat-footer">
          <div id="voiceStatus" class="voice-hint"></div>
          <div class="input-row">
            <textarea id="message" class="chat-textarea" placeholder="输入问题，Ctrl+Enter 发送…" rows="1"></textarea>
            <button id="askBtn" class="send-btn" title="发送">↑</button>
          </div>
          <div class="aux-row">
            <button id="voiceInputBtn" class="aux-btn">🎤 语音</button>
            <button id="speakAnswerBtn" class="aux-btn">🔊 朗读</button>
            <button id="stopSpeechBtn" class="aux-btn">⏹ 停止</button>
          </div>
        </div>

        <!-- JS 兼容 IDs -->
        <div id="answer" style="display:none;"></div>
        <span id="heroTitle" style="display:none;"></span>
        <span id="modeState" style="display:none;"></span>
        <span id="deptState" style="display:none;"></span>
      </aside>
    </div>
  </main>
  <script src="/static/user.js"></script>
</body>
</html>
