<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedFlow 运维控制台</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --paper: #fffdf8;
      --bg: #f4f3ec;
      --ink: #171512;
      --muted: #686d66;
      --line: #d7d4c8;
      --green: #0c6f62;
      --danger: #9c3d37;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Times New Roman", "Noto Serif SC", serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, .86);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1, h2, h3 { margin: 0; }
    h1 { font-size: 28px; }
    a { color: var(--ink); text-decoration: none; }
    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 28px auto 48px;
      display: grid;
      gap: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    section, .card {
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 20px;
    }
    .card h3 {
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .metric {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .muted { color: var(--muted); }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f7f5ed;
      border: 1px solid var(--line);
      padding: 14px;
      margin: 0;
      line-height: 1.55;
    }
    button, input, textarea, select {
      font: inherit;
    }
    button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--ink);
    }
    button.danger {
      background: var(--danger);
      border-color: var(--danger);
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px;
    }
    textarea { min-height: 120px; resize: vertical; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 10px 8px;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 700; }
    .status-ok { color: var(--green); }
    .status-bad { color: var(--danger); }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>MedFlow 运维控制台</h1>
      <div class="muted">豆包实时语音 / 医生资料库 / 服务状态</div>
    </div>
    <nav class="toolbar">
      <a href="/">官网</a>
      <a href="/hospital-ai">数字人</a>
      <button id="refreshBtn" type="button">刷新</button>
    </nav>
  </header>

  <main>
    <div class="grid">
      <div class="card">
        <h3>Doubao Realtime</h3>
        <div id="doubaoStatus" class="metric">读取中</div>
        <div id="doubaoDetail" class="muted"></div>
      </div>
      <div class="card">
        <h3>Traffic</h3>
        <div id="trafficStatus" class="metric">读取中</div>
        <div id="trafficDetail" class="muted"></div>
      </div>
      <div class="card">
        <h3>Doctor Memory</h3>
        <div id="memoryStatus" class="metric">读取中</div>
        <div id="memoryDetail" class="muted"></div>
      </div>
    </div>

    <section>
      <h2>当前配置</h2>
      <pre id="runtimeInfo">读取中...</pre>
    </section>

    <section>
      <div class="toolbar">
        <h2 style="flex:1">资料库</h2>
        <input id="memorySearch" placeholder="搜索标题或内容" />
        <button id="memorySearchBtn" type="button" class="secondary">搜索</button>
      </div>
      <div id="memoryWriteBox" style="display:none">
        <div class="form-grid">
          <label for="memoryKind">类型</label>
          <input id="memoryKind" value="note" />
          <label for="memoryTitle">标题</label>
          <input id="memoryTitle" />
          <label for="memoryTags">标签</label>
          <input id="memoryTags" placeholder="逗号分隔" />
          <label for="memoryContent">内容</label>
          <textarea id="memoryContent"></textarea>
          <span></span>
          <button id="memoryCreateBtn" type="button">新增资料</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:72px">ID</th>
            <th style="width:120px">类型</th>
            <th style="width:220px">标题</th>
            <th>内容</th>
            <th style="width:86px">操作</th>
          </tr>
        </thead>
        <tbody id="memoryRows"></tbody>
      </table>
    </section>

    <section>
      <h2>服务快照</h2>
      <pre id="opsSnapshot">读取中...</pre>
    </section>
  </main>

  <script src="/static/console.js?v={{ v|default('1') }}"></script>
</body>
</html>
