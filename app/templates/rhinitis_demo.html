<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鼻敏智诊 Demo | MedFlow</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --paper: #f4f1e7;
      --surface: #fffdf7;
      --surface-soft: rgba(255, 253, 247, .68);
      --ink: #192b28;
      --muted: #687772;
      --line: rgba(25, 43, 40, .15);
      --line-strong: rgba(25, 43, 40, .32);
      --green: #105f52;
      --teal: #0b7f71;
      --copper: #9e6948;
      --amber: #a7792d;
      --red: #8b3d32;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
      --mono: "SFMono-Regular", "Cascadia Mono", "Roboto Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(16, 95, 82, .05) 1px, transparent 1px) 0 0 / 72px 72px,
        linear-gradient(180deg, rgba(244, 241, 231, .96), rgba(224, 237, 231, .92)),
        url("/static/medical-field-bg.png") center / cover fixed no-repeat;
      font-family: var(--sans);
      line-height: 1.55;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(244, 241, 231, .78);
      pointer-events: none;
    }

    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    button, input, textarea { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 241, 231, .9);
      backdrop-filter: blur(18px);
    }

    .nav,
    .page {
      width: min(1460px, calc(100% - 36px));
      margin: 0 auto;
    }

    .nav {
      min-height: 68px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: var(--surface);
      background: var(--green);
      font-family: var(--serif);
      font-weight: 700;
    }

    .brand strong {
      display: block;
      font-size: 15px;
      line-height: 1.2;
    }

    .brand span span {
      color: var(--muted);
      font-size: 12px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      border: 1px solid transparent;
      padding: 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav-links a:hover,
    .nav-links .active {
      border-color: var(--line-strong);
      color: var(--ink);
      background: rgba(255, 253, 247, .58);
    }

    .page {
      display: grid;
      gap: 24px;
      padding: 28px 0 54px;
    }

    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
    }

    .eyebrow,
    .label,
    code {
      color: var(--copper);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3 {
      font-family: var(--serif);
      line-height: 1.08;
      color: var(--ink);
    }

    h1 {
      margin-top: 8px;
      font-size: clamp(34px, 4.1vw, 58px);
    }

    h2 { font-size: clamp(24px, 2.2vw, 36px); }
    h3 { font-size: 20px; }

    .status-pill {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line-strong);
      background: var(--surface-soft);
      color: var(--muted);
      padding: 0 14px;
      white-space: nowrap;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, .52fr) minmax(0, 1fr);
      gap: clamp(20px, 3vw, 34px);
      align-items: start;
    }

    .panel {
      display: grid;
      gap: 16px;
      min-width: 0;
      border-top: 1px solid var(--line-strong);
      padding-top: 18px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 14px;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field span {
      color: var(--muted);
      font-size: 13px;
    }

    input,
    textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, .78);
      color: var(--ink);
      padding: 11px 12px;
      outline: none;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(16, 95, 82, .12);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button,
    .button-link {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--green);
      background: var(--green);
      color: var(--surface);
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary,
    .button-link.secondary {
      background: rgba(255, 253, 247, .56);
      color: var(--ink);
      border-color: var(--line-strong);
    }

    button:disabled {
      cursor: wait;
      opacity: .68;
    }

    .summary-grid {
      display: grid;
      gap: 16px;
    }

    .result-shell {
      display: grid;
      gap: 14px;
      min-width: 0;
    }

    .output-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      border-bottom: 1px solid var(--line-strong);
      padding-bottom: 10px;
    }

    .output-tab {
      min-width: 0;
      min-height: 48px;
      border-color: var(--line);
      background: rgba(255, 253, 247, .58);
      color: var(--muted);
      padding: 0 12px;
      gap: 7px;
      white-space: normal;
    }

    .output-tab[aria-selected="true"] {
      border-color: var(--green);
      background: var(--green);
      color: var(--surface);
    }

    .tab-count {
      font-family: var(--mono);
      font-size: 11px;
      opacity: .8;
    }

    .output-band {
      display: grid;
      gap: 13px;
      padding: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, .66);
      min-width: 0;
    }

    .output-band.doctor { border-left: 4px solid var(--green); }
    .output-band.patient { border-left: 4px solid var(--teal); }
    .output-band.script { border-left: 4px solid var(--copper); }

    .output-band[hidden] {
      display: none;
    }

    .section-list,
    .plain-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding-left: 20px;
    }

    .section-block {
      display: grid;
      gap: 8px;
    }

    .section-block h3 {
      font-size: 18px;
    }

    .script-text,
    .paragraphs {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .paragraphs {
      display: grid;
      gap: 10px;
    }

    .refs {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }

    .ref-pill {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      background: rgba(16, 95, 82, .08);
      color: var(--green);
      padding: 0 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
    }

    .citation-card {
      display: grid;
      gap: 0;
      border: 1px solid var(--line);
      background: rgba(255, 253, 247, .54);
      min-width: 0;
    }

    .citation-card summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      min-width: 0;
      padding: 10px;
      cursor: pointer;
      list-style: none;
    }

    .citation-card summary::-webkit-details-marker {
      display: none;
    }

    .citation-title {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .citation-body {
      display: grid;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding: 11px 12px 12px;
    }

    .citation-body p {
      color: var(--ink);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .citation-body .button-link {
      justify-self: start;
      min-height: 32px;
      padding: 0 10px;
      font-size: 12px;
    }

    .evidence-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .empty-state {
      min-height: 220px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line-strong);
      color: var(--muted);
      text-align: center;
      padding: 22px;
      background: rgba(255, 253, 247, .42);
    }

    .error {
      color: var(--red);
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .workspace,
      .page-head {
        grid-template-columns: 1fr;
      }

      .status-pill {
        justify-self: start;
      }
    }

    @media (max-width: 720px) {
      .nav,
      .page {
        width: min(100% - 24px, 1460px);
      }

      .nav {
        grid-template-columns: 1fr;
        align-items: start;
        padding: 12px 0;
      }

      .nav-links {
        justify-content: start;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: clamp(34px, 11vw, 46px);
      }

      .output-tabs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav" aria-label="主导航">
      <a class="brand" href="/" aria-label="返回 MedFlow 官网">
        <span class="brand-mark">M</span>
        <span>
          <strong>MedFlow</strong>
          <span>{{ site.legal_name }}</span>
        </span>
      </a>
      <div class="nav-links">
        <a href="/rhinitis-ai">鼻敏智诊</a>
        <a class="active" href="/rhinitis-demo">病例 Demo</a>
        <a href="/rhinitis-evidence">证据检索</a>
        <a href="/rhinitis-review">证据审核</a>
        <a href="/hospital-ai">数字人</a>
      </div>
    </nav>
  </header>

  <main class="page">
    <section class="page-head" aria-label="鼻敏智诊病例 Demo">
      <div>
        <div class="eyebrow">Rhinitis Demo</div>
        <h1>鼻敏智诊病例摘要 Demo</h1>
      </div>
      <div class="status-pill" id="demoStatus">读取示例病例...</div>
    </section>

    <section class="workspace" aria-label="病例摘要生成">
      <section class="panel" aria-label="病例输入">
        <div class="panel-head">
          <div>
            <div class="label">Case</div>
            <h2>病例输入</h2>
          </div>
          <button class="secondary" id="resetCaseButton" type="button">恢复示例</button>
        </div>

        <form class="form-grid" id="demoForm">
          <label class="field">
            <span>人群</span>
            <input id="ageGroup" autocomplete="off" />
          </label>
          <label class="field">
            <span>主要症状</span>
            <textarea id="mainSymptoms"></textarea>
          </label>
          <label class="field">
            <span>病程</span>
            <textarea id="duration"></textarea>
          </label>
          <label class="field">
            <span>季节性</span>
            <textarea id="seasonality"></textarea>
          </label>
          <label class="field">
            <span>诱因</span>
            <textarea id="triggers"></textarea>
          </label>
          <label class="field">
            <span>用药史</span>
            <textarea id="medicationHistory"></textarea>
          </label>
          <label class="field">
            <span>过敏原 / IgE</span>
            <textarea id="allergenTests"></textarea>
          </label>
          <label class="field">
            <span>鼻内镜</span>
            <textarea id="nasalEndoscopy"></textarea>
          </label>
          <label class="field">
            <span>合并情况</span>
            <textarea id="comorbidities"></textarea>
          </label>
          <label class="field">
            <span>患者目标</span>
            <textarea id="patientGoal"></textarea>
          </label>
          <div class="actions">
            <button id="generateButton" type="submit">生成摘要</button>
            <a class="button-link secondary" href="/rhinitis-evidence">查看证据</a>
          </div>
        </form>
      </section>

      <section class="panel" aria-label="生成结果">
        <div class="panel-head">
          <div>
            <div class="label">Output</div>
            <h2>医生摘要 / 宣教 / 口播</h2>
          </div>
          <code id="outputId">no output</code>
        </div>
        <div class="summary-grid" id="summaryResults">
          <div class="empty-state">等待生成。</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const form = $("demoForm");
    const statusEl = $("demoStatus");
    const outputIdEl = $("outputId");
    const resultsEl = $("summaryResults");
    const generateButton = $("generateButton");
    let sampleCase = null;

    const fields = {
      age_group: $("ageGroup"),
      main_symptoms: $("mainSymptoms"),
      duration: $("duration"),
      seasonality: $("seasonality"),
      triggers: $("triggers"),
      medication_history: $("medicationHistory"),
      allergen_tests: $("allergenTests"),
      nasal_endoscopy: $("nasalEndoscopy"),
      comorbidities: $("comorbidities"),
      patient_goal: $("patientGoal"),
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function splitList(value) {
      return String(value || "")
        .split(/[、，,\n]/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function fillCase(payload) {
      fields.age_group.value = payload.age_group || "";
      fields.main_symptoms.value = (payload.main_symptoms || []).join("、");
      fields.duration.value = payload.duration || "";
      fields.seasonality.value = payload.seasonality || "";
      fields.triggers.value = (payload.triggers || []).join("、");
      fields.medication_history.value = payload.medication_history || "";
      fields.allergen_tests.value = payload.allergen_tests || "";
      fields.nasal_endoscopy.value = payload.nasal_endoscopy || "";
      fields.comorbidities.value = (payload.comorbidities || []).join("、");
      fields.patient_goal.value = payload.patient_goal || "";
    }

    function readCase() {
      return {
        age_group: fields.age_group.value.trim(),
        main_symptoms: splitList(fields.main_symptoms.value),
        duration: fields.duration.value.trim(),
        seasonality: fields.seasonality.value.trim(),
        triggers: splitList(fields.triggers.value),
        medication_history: fields.medication_history.value.trim(),
        allergen_tests: fields.allergen_tests.value.trim(),
        nasal_endoscopy: fields.nasal_endoscopy.value.trim(),
        comorbidities: splitList(fields.comorbidities.value),
        patient_goal: fields.patient_goal.value.trim(),
      };
    }

    function citationMetaHtml(item) {
      const values = [
        item.evidence_level || "evidence",
        item.year || "",
        item.journal_or_org || "",
        item.patient_visible ? "患者可见" : "医生端",
      ].filter(Boolean);
      return `<div class="evidence-meta">${values.map((value) => `<span>${escapeHtml(value)}</span>`).join("")}</div>`;
    }

    function citationCardsHtml(items) {
      const values = items || [];
      if (!values.length) return "";
      return `
        <div class="refs" aria-label="引用证据">
          ${values.map((item) => `
            <details class="citation-card" data-ref="${escapeHtml(item.ref || "")}">
              <summary>
                <span class="ref-pill">${escapeHtml(item.ref || "REF")}</span>
                <span class="citation-title">${escapeHtml(item.title || "未命名证据")}</span>
              </summary>
              <div class="citation-body">
                <p>${escapeHtml(item.snippet || item.heading || "暂无摘要片段。")}</p>
                ${citationMetaHtml(item)}
                ${item.url ? `<a class="button-link secondary" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">打开来源</a>` : ""}
              </div>
            </details>
          `).join("")}
        </div>
      `;
    }

    function doctorHtml(section, evidenceItems) {
      return `
        <section class="output-band doctor" id="panel-doctor" role="tabpanel" data-panel="doctor">
          <div>
            <div class="label">Doctor</div>
            <h2>${escapeHtml(section.title)}</h2>
          </div>
          ${(section.sections || []).map((block) => `
            <div class="section-block">
              <h3>${escapeHtml(block.heading)}</h3>
              <ul class="section-list">
                ${(block.items || []).map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
              </ul>
            </div>
          `).join("")}
          ${citationCardsHtml(evidenceItems)}
        </section>
      `;
    }

    function patientHtml(section, evidenceItems) {
      return `
        <section class="output-band patient" id="panel-patient" role="tabpanel" data-panel="patient" hidden>
          <div>
            <div class="label">Patient</div>
            <h2>${escapeHtml(section.title)}</h2>
          </div>
          <div class="paragraphs">
            ${(section.paragraphs || []).map((item) => `<p>${escapeHtml(item)}</p>`).join("")}
          </div>
          ${citationCardsHtml(evidenceItems)}
        </section>
      `;
    }

    function scriptHtml(section, evidenceItems) {
      return `
        <section class="output-band script" id="panel-script" role="tabpanel" data-panel="script" hidden>
          <div>
            <div class="label">Avatar</div>
            <h2>${escapeHtml(section.title)}</h2>
          </div>
          <p class="script-text">${escapeHtml(section.script)}</p>
          ${citationCardsHtml(evidenceItems)}
        </section>
      `;
    }

    function tabButtonHtml(target, label, count, selected) {
      return `
        <button
          class="output-tab"
          type="button"
          role="tab"
          id="tab-${target}"
          data-target="${target}"
          aria-controls="panel-${target}"
          aria-selected="${selected ? "true" : "false"}"
        >
          <span>${escapeHtml(label)}</span>
          <span class="tab-count">${count} 引用</span>
        </button>
      `;
    }

    function activateOutputTab(target) {
      resultsEl.querySelectorAll(".output-tab").forEach((button) => {
        const active = button.dataset.target === target;
        button.setAttribute("aria-selected", active ? "true" : "false");
      });
      resultsEl.querySelectorAll("[data-panel]").forEach((panel) => {
        panel.hidden = panel.dataset.panel !== target;
      });
    }

    function renderSummary(payload) {
      outputIdEl.textContent = payload.output_id || "no output";
      const retrieval = payload.retrieval || {};
      statusEl.textContent = `唯一证据 ${retrieval.unique_evidence_count || 0} · 引用记录 ${payload.citation_record_count || 0}`;
      const evidence = payload.evidence || {};
      const doctorEvidence = evidence.doctor_summary || [];
      const patientEvidence = evidence.patient_education || [];
      const scriptEvidence = evidence.digital_human_script || [];
      resultsEl.innerHTML = `
        <div class="result-shell">
          <div class="output-tabs" role="tablist" aria-label="生成结果切换">
            ${tabButtonHtml("doctor", "医生摘要", doctorEvidence.length, true)}
            ${tabButtonHtml("patient", "患者宣教", patientEvidence.length, false)}
            ${tabButtonHtml("script", "数字人口播", scriptEvidence.length, false)}
          </div>
          <div class="tab-panels">
            ${doctorHtml(payload.doctor_summary || {}, doctorEvidence)}
            ${patientHtml(payload.patient_education || {}, patientEvidence)}
            ${scriptHtml(payload.digital_human_script || {}, scriptEvidence)}
          </div>
        </div>
      `;
      activateOutputTab("doctor");
    }

    async function loadSampleCase() {
      statusEl.textContent = "读取示例病例...";
      const response = await fetch("/api/rhinitis/demo/sample-case");
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const payload = await response.json();
      sampleCase = payload.case || {};
      fillCase(sampleCase);
      statusEl.textContent = "示例病例已载入";
    }

    async function generateSummary() {
      generateButton.disabled = true;
      statusEl.textContent = "生成中...";
      resultsEl.innerHTML = `<div class="empty-state">正在检索精选证据并生成摘要...</div>`;
      const response = await fetch("/api/rhinitis/demo/summary", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ case: readCase() }),
      });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.detail || `HTTP ${response.status}`);
      }
      renderSummary(payload);
    }

    $("resetCaseButton").addEventListener("click", () => {
      if (sampleCase) fillCase(sampleCase);
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await generateSummary();
      } catch (error) {
        statusEl.textContent = "生成失败";
        resultsEl.innerHTML = `<div class="empty-state error">${escapeHtml(error.message || error)}</div>`;
      } finally {
        generateButton.disabled = false;
      }
    });

    resultsEl.addEventListener("click", (event) => {
      const button = event.target.closest(".output-tab");
      if (!button || !resultsEl.contains(button)) return;
      activateOutputTab(button.dataset.target);
    });

    loadSampleCase()
      .then(generateSummary)
      .catch((error) => {
        statusEl.textContent = "读取失败";
        resultsEl.innerHTML = `<div class="empty-state error">${escapeHtml(error.message || error)}</div>`;
      })
      .finally(() => {
        generateButton.disabled = false;
      });
  </script>
</body>
</html>
