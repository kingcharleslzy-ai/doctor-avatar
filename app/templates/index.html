<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>医生虚拟人 MVP</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4efe5;
      --panel: #fffaf2;
      --ink: #22201c;
      --accent: #126a6a;
      --line: #d8cfbf;
      --soft: #efe7d8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(18,106,106,.12), transparent 25%),
        linear-gradient(180deg, #f8f3ea 0%, var(--bg) 100%);
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .hero, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(42, 37, 27, 0.06);
    }
    .hero {
      padding: 28px;
      margin-bottom: 20px;
    }
    .hero h1 { margin: 0 0 12px; font-size: 32px; }
    .hero p { margin: 0; line-height: 1.7; }
    .grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 20px;
    }
    .panel {
      padding: 20px;
    }
    .stack {
      display: grid;
      gap: 14px;
    }
    textarea, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 140px; resize: vertical; }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #6d665b;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button + button { margin-left: 10px; }
    .output, .muted {
      white-space: pre-wrap;
      line-height: 1.7;
    }
    .muted { color: #6d665b; }
    .video-stage {
      min-height: 320px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #1a1d1e;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .placeholder {
      color: #d6dddf;
      padding: 16px;
      text-align: center;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar button + button {
      margin-left: 0;
    }
    .kv {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      background: var(--soft);
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #6d665b;
    }
    .checkbox-line input {
      width: auto;
    }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>医生虚拟人 MVP</h1>
      <p>这个版本先把 3 层搭起来：本地知识库、OpenAI 问答、HeyGen/LiveAvatar 会话接口。你可以先用文本方式调医生人格，再接入 HeyGen 视频分身。</p>
    </section>

    <section class="grid">
      <div class="panel">
        <h2>视频会话控制台</h2>
        <div class="stack">
          <div class="video-stage" id="videoStage">
            <div class="placeholder">远端视频将在这里出现</div>
          </div>
          <div class="kv">
            <strong>LiveKit 连接状态</strong>
            <span id="connectionState">未连接</span>
          </div>
          <div>
            <label for="avatarId">Avatar ID</label>
            <input id="avatarId" placeholder="Sandbox 可先留空，生产环境填真实 avatar_id" />
          </div>
          <div>
            <label for="voiceId">Voice ID</label>
            <input id="voiceId" placeholder="可选" />
          </div>
          <div>
            <label for="contextId">Context ID</label>
            <input id="contextId" placeholder="可选" />
          </div>
          <div>
            <label for="language">语言</label>
            <input id="language" value="zh" />
          </div>
          <div class="checkbox-line">
            <input id="sandboxMode" type="checkbox" checked />
            <span>启用 Sandbox 模式</span>
          </div>
          <div class="checkbox-line">
            <input id="pushToTalk" type="checkbox" />
            <span>启用 Push-to-Talk 模式</span>
          </div>
          <div>
            <label for="sessionToken">Session Token</label>
            <input id="sessionToken" placeholder="创建 token 后会自动填入" />
          </div>
          <div class="toolbar">
            <button id="createTokenBtn">创建 Token</button>
            <button id="startSessionBtn">启动 Session</button>
            <button id="keepAliveBtn">Keep Alive</button>
            <button id="listSessionsBtn">列出 Sessions</button>
            <button id="disconnectBtn">断开房间</button>
          </div>
          <div>
            <h3>Session 信息</h3>
            <div id="sessionInfo" class="output muted">还没有启动 session。</div>
          </div>
          <div>
            <h3>事件日志</h3>
            <div id="eventLog" class="output muted">等待操作。</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>对话层调试</h2>
        <p class="muted">这里先验证后端问答、知识库和医生风格壳子。</p>
        <textarea id="message" placeholder="例如：最近总是胸闷，需要马上去医院吗？"></textarea>
        <div style="margin-top: 14px;">
          <button id="sendBtn">发送问答</button>
        </div>
        <h3>回答</h3>
        <div id="answer" class="output muted">还没有回答。</div>
        <h3>命中知识片段</h3>
        <div id="context" class="output muted">还没有检索。</div>
        <h3>接口返回</h3>
        <div id="apiResult" class="output muted">还没有请求。</div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
