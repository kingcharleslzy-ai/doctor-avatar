<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>李勇医生 AI 医疗助手</title>
  <script defer src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    /* ========== CSS 变量 - 统一主题 ========== */
    :root {
      --bg: #f5f6f8;
      --surface: rgba(255,255,255,0.92);
      --surface-solid: #ffffff;
      --line: rgba(17,24,39,0.08);
      --line-strong: rgba(17,24,39,0.12);
      --text: #111824;
      --text-light: #374151;
      --muted: #61707d;
      --muted-light: #9ca3af;
      --accent: #0f766e;
      --accent-light: #14b8a6;
      --ai: #215dff;
      --ai-light: #3b82f6;
      --danger: #dc2626;
      --warning-bg: rgba(255,246,234,0.96);
      --warning-line: rgba(193,123,47,0.18);
      --shadow: 0 8px 28px rgba(15,23,42,0.09);
      --shadowStrong: 0 12px 40px rgba(15,23,42,0.12);
      
      /* 间距变量 */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      --space-2xl: 32px;
      
      /* 圆角 */
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --radius-full: 9999px;
      
      /* 字体 */
      --font-sans: "SF Pro Display", "PingFang SC", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* ========== 基础重置 ========== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-sans);
      background: linear-gradient(180deg, #fafbfd 0%, #eef2f5 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ========== 布局容器 ========== */
    .app-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ========== 顶栏 ========== */
    .topbar {
      background: var(--surface-solid);
      border-bottom: 1px solid var(--line);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      background: linear-gradient(135deg, var(--text) 0%, var(--ai) 100%);
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(33,93,255,0.25);
    }

    .brand-text h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand-text p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .topbar-chip {
      padding: 6px 12px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.8);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    /* ========== 主内容区 ========== */
    .main-content {
      flex: 1;
      display: grid;
      gap: var(--space-md);
      padding: var(--space-md);
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* 桌面端：双栏布局 */
    @media (min-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr 400px;
        padding: var(--space-lg);
        gap: var(--space-lg);
      }
    }

    /* 平板端 */
    @media (min-width: 768px) and (max-width: 1023px) {
      .main-content {
        grid-template-columns: 1fr 360px;
        padding: var(--space-lg);
      }
    }

    /* ========== 卡片通用样式 ========== */
    .card {
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    /* ========== 视频区 ========== */
    .video-section {
      display: flex;
      flex-direction: column;
      min-height: 280px;
    }

    @media (min-width: 768px) {
      .video-section {
        min-height: 400px;
      }
    }

    @media (min-width: 1024px) {
      .video-section {
        min-height: 500px;
      }
    }

    .video-stage {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: 
        radial-gradient(circle at 18% 12%, rgba(124,226,218,0.2), transparent 22%),
        radial-gradient(circle at 85% 10%, rgba(33,93,255,0.18), transparent 24%),
        linear-gradient(180deg, #121a25 0%, #0a1118 100%);
      min-height: 200px;
    }

    .video-stage::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .avatar-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-container svg {
      width: 100%;
      height: 100%;
      max-height: 400px;
    }

    @media (min-width: 768px) {
      .avatar-container svg {
        max-height: 450px;
      }
    }

    .avatar-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px var(--space-lg) var(--space-lg);
      background: linear-gradient(0deg, rgba(8,14,22,0.92) 0%, rgba(8,14,22,0.5) 50%, transparent 100%);
      color: rgba(240,247,249,0.96);
    }

    .av-badge {
      display: inline-flex;
      padding: 5px 10px;
      border-radius: var(--radius-full);
      background: rgba(124,226,218,0.14);
      color: #a3f1ec;
      border: 1px solid rgba(124,226,218,0.2);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .av-name {
      margin-top: var(--space-md);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    @media (min-width: 768px) {
      .av-name {
        font-size: 28px;
      }
    }

    .av-meta {
      margin-top: var(--space-xs);
      font-size: 13px;
      color: rgba(240,247,249,0.7);
      line-height: 1.6;
    }

    .video-controls {
      padding: var(--space-md) var(--space-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      border-top: 1px solid var(--line);
      background: var(--surface-solid);
    }

    .conn-status {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 13px;
      color: var(--muted);
    }

    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted-light);
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .conn-dot.active {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,0.5);
    }

    .video-actions {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    /* ========== 按钮样式 ========== */
    .btn {
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: var(--ai);
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      font-size: 13px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--ai-light);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.9);
      color: var(--text-light);
      border: 1px solid var(--line);
      padding: 8px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #fff;
      border-color: var(--line-strong);
    }

    .btn-danger {
      background: rgba(220,38,38,0.1);
      color: var(--danger);
      border: 1px solid rgba(220,38,38,0.2);
      padding: 8px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(220,38,38,0.15);
    }

    /* ========== 聊天区 ========== */
    .chat-section {
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }

    @media (min-width: 1024px) {
      .chat-section {
        min-height: 500px;
      }
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
      scroll-behavior: smooth;
      max-height: 50vh;
    }

    @media (min-width: 1024px) {
      .chat-history {
        max-height: none;
      }
    }

    .chat-history::-webkit-scrollbar {
      width: 5px;
    }

    .chat-history::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-history::-webkit-scrollbar-thumb {
      background: rgba(17,24,39,0.1);
      border-radius: var(--radius-full);
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.ai {
      align-self: flex-start;
    }

    .message-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: var(--space-xs);
    }

    .message.user .message-label {
      text-align: right;
      color: var(--ai);
    }

    .message-bubble {
      padding: 12px 16px;
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .message-bubble {
      background: var(--text);
      color: #fff;
      border-radius: 18px 18px 4px 18px;
    }

    .message.ai .message-bubble {
      background: transparent;
      color: var(--text);
      padding: 0;
    }

    .typing-indicator {
      display: inline-flex;
      gap: 5px;
      padding: 12px 16px;
      background: rgba(17,24,39,0.06);
      border-radius: 18px 18px 18px 4px;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      50% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* ========== 医生信息区 ========== */
    .doctor-info {
      border-top: 1px solid var(--line);
    }

    .doctor-info summary {
      padding: var(--space-md) var(--space-lg);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: background 0.2s;
    }

    .doctor-info summary:hover {
      background: rgba(0,0,0,0.02);
    }

    .doctor-info summary::-webkit-details-marker {
      display: none;
    }

    .doctor-info summary::after {
      content: "›";
      color: var(--muted);
      font-size: 20px;
      transition: transform 0.2s;
    }

    .doctor-info[open] summary::after {
      transform: rotate(90deg);
    }

    .doctor-info-body {
      padding: 0 var(--space-lg) var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .notice-box {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--warning-bg);
      border: 1px solid var(--warning-line);
      color: #7c5a2f;
      font-size: 13px;
      line-height: 1.7;
    }

    .info-text {
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }

    .tag {
      padding: 6px 12px;
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      color: var(--text-light);
      font-size: 12px;
    }

    .info-list {
      margin: 0;
      padding-left: var(--space-lg);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .info-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      word-break: break-word;
    }

    .info-link:hover {
      text-decoration: underline;
    }

    /* ========== 输入区 ========== */
    .chat-input-area {
      padding: var(--space-md) var(--space-lg);
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      background: var(--surface-solid);
    }

    .voice-hint {
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: var(--space-sm);
      background: rgba(255,255,255,0.95);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: var(--space-sm) var(--space-sm) var(--space-sm) var(--space-md);
      box-shadow: 0 2px 6px rgba(15,23,42,0.04);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--accent-light);
      box-shadow: 0 2px 12px rgba(15,23,42,0.08);
    }

    .chat-textarea {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      outline: none;
      min-height: 24px;
      max-height: 120px;
      overflow-y: auto;
    }

    .chat-textarea::placeholder {
      color: var(--muted-light);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
      font-weight: 700;
      transition: transform 0.15s, background 0.2s;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--ai);
      transform: scale(1.05);
    }

    .action-row {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    /* ========== 响应式调整 ========== */
    
    /* 小屏幕下的调整 */
    @media (max-width: 767px) {
      .topbar {
        padding: var(--space-sm) var(--space-md);
      }

      .brand-text h1 {
        font-size: 15px;
      }

      .brand-text p {
        font-size: 11px;
      }

      .topbar-chip {
        display: none;
      }

      .main-content {
        padding: var(--space-sm);
        gap: var(--space-sm);
      }

      .video-controls {
        padding: var(--space-sm) var(--space-md);
      }

      .chat-history {
        padding: var(--space-md);
        min-height: 200px;
      }

      .chat-input-area {
        padding: var(--space-sm) var(--space-md);
      }

      .doctor-info summary {
        padding: var(--space-sm) var(--space-md);
        font-size: 13px;
      }

      .doctor-info-body {
        padding: 0 var(--space-md) var(--space-md);
      }
    }

    /* 超大屏幕 */
    @media (min-width: 1400px) {
      .main-content {
        max-width: 1200px;
      }
    }

    /* 暗色模式支持（可选） */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1419;
        --surface: rgba(30,40,50,0.95);
        --surface-solid: #1a2332;
        --line: rgba(255,255,255,0.08);
        --text: #e7e9ea;
        --muted: #8b98a5;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">李</div>
        <div class="brand-text">
          <h1>李勇医生 AI 医疗助手</h1>
          <p id="brandSubtitle">杭州市第一人民医院 · 耳鼻咽喉科</p>
        </div>
      </div>
      <span class="topbar-chip">仅供健康科普与就医参考</span>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
      
      <!-- 视频区 -->
      <section class="card video-section">
        <div class="video-stage" id="videoStage">
          <div class="avatar-container">
            <svg viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
              <defs>
                <radialGradient id="avH" cx="38%" cy="30%" r="62%"><stop offset="0%" stop-color="#dce9f0"/><stop offset="100%" stop-color="#96afc0"/></radialGradient>
                <radialGradient id="avC" cx="28%" cy="20%" r="72%"><stop offset="0%" stop-color="#edf4f8"/><stop offset="100%" stop-color="#bccedd"/></radialGradient>
                <linearGradient id="avR" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7ce0d7"/><stop offset="100%" stop-color="#4b7cff"/></linearGradient>
                <filter id="avG"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              </defs>
              
              <!-- 脉冲环 -->
              <circle cx="180" cy="175" r="90" fill="none" stroke="url(#avR)" stroke-width="1.2" opacity="0.3">
                <animate attributeName="r" values="88;102;88" dur="3s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3s" repeatCount="indefinite"/>
              </circle>
              <circle cx="180" cy="175" r="112" fill="none" stroke="url(#avR)" stroke-width="0.7" opacity="0.14">
                <animate attributeName="r" values="110;128;110" dur="3s" begin="0.5s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.14;0.03;0.14" dur="3s" begin="0.5s" repeatCount="indefinite"/>
              </circle>
              
              <!-- 医生形象 -->
              <path d="M93 318 C88 278 108 255 138 248 L162 316 L198 316 L222 248 C252 255 272 278 267 318 L267 450 L93 450Z" fill="url(#avC)"/>
              <path d="M138 248 L162 316 L162 450 L110 450 L110 295 Q116 265 138 248Z" fill="rgba(0,0,0,0.055)"/>
              <path d="M222 248 L198 316 L198 450 L250 450 L250 295 Q244 265 222 248Z" fill="rgba(0,0,0,0.055)"/>
              <path d="M154 252 L162 316 L198 316 L206 252 L180 268Z" fill="rgba(255,255,255,0.3)"/>
              <rect x="165" y="208" width="30" height="46" rx="13" fill="url(#avH)"/>
              <ellipse cx="180" cy="170" rx="55" ry="59" fill="url(#avH)"/>
              <ellipse cx="162" cy="172" rx="18" ry="50" fill="rgba(0,0,0,0.05)"/>
              <path d="M125 158 Q127 104 180 99 Q233 104 235 158 Q226 124 180 122 Q134 124 125 158Z" fill="#22303e" opacity="0.88"/>
              <path d="M144 111 Q170 103 196 106" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="2.5" stroke-linecap="round"/>
              <ellipse cx="125" cy="173" rx="10" ry="14" fill="url(#avH)"/>
              <ellipse cx="235" cy="173" rx="10" ry="14" fill="url(#avH)"/>
              <ellipse cx="160" cy="165" rx="9" ry="10" fill="#1b2b3a"/>
              <ellipse cx="200" cy="165" rx="9" ry="10" fill="#1b2b3a"/>
              <circle cx="160" cy="165" r="5" fill="#2d4868"/>
              <circle cx="200" cy="165" r="5" fill="#2d4868"/>
              <circle cx="162" cy="162" r="2.8" fill="white" opacity="0.88"/>
              <circle cx="202" cy="162" r="2.8" fill="white" opacity="0.88"/>
              <path d="M150 151 Q160 147 170 150" fill="none" stroke="#22303e" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M190 150 Q200 147 210 151" fill="none" stroke="#22303e" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M176 177 Q180 186 184 177" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M166 192 Q180 202 194 192" fill="none" stroke="rgba(50,75,90,0.48)" stroke-width="2" stroke-linecap="round"/>
              
              <!-- 听诊器 -->
              <path d="M148 258 Q136 276 134 298 Q132 316 143 326 Q155 338 167 326 Q179 314 175 298" fill="none" stroke="#7ce0d7" stroke-width="4" stroke-linecap="round" filter="url(#avG)"/>
              <circle cx="175" cy="296" r="10" fill="none" stroke="#7ce0d7" stroke-width="3.5" filter="url(#avG)"/>
              <circle cx="175" cy="296" r="4.5" fill="#7ce0d7" opacity="0.38"/>
              <path d="M148 258 Q150 244 158 240 Q166 236 170 244" fill="none" stroke="#7ce0d7" stroke-width="3" stroke-linecap="round"/>
              <circle cx="148" cy="258" r="4.5" fill="#7ce0d7" opacity="0.62"/>
              <circle cx="170" cy="244" r="4.5" fill="#7ce0d7" opacity="0.62"/>
              
              <!-- 口袋+十字 -->
              <rect x="204" y="276" width="40" height="34" rx="7" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
              <rect x="219" y="283" width="10" height="20" rx="3" fill="#7ce0d7" opacity="0.76"/>
              <rect x="213" y="289" width="22" height="8" rx="3" fill="#7ce0d7" opacity="0.76"/>
              
              <!-- 漂浮粒子 -->
              <circle cx="95" cy="138" r="3.5" fill="#7ce0d7" opacity="0.5" filter="url(#avG)">
                <animate attributeName="cy" values="138;124;138" dur="2.7s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.5;0.14;0.5" dur="2.7s" repeatCount="indefinite"/>
              </circle>
              <circle cx="270" cy="158" r="2.5" fill="#4b7cff" opacity="0.44" filter="url(#avG)">
                <animate attributeName="cy" values="158;143;158" dur="3.3s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.44;0.11;0.44" dur="3.3s" repeatCount="indefinite"/>
              </circle>
              <circle cx="76" cy="245" r="3" fill="#7ce0d7" opacity="0.36">
                <animate attributeName="cy" values="245;229;245" dur="3s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.36;0.09;0.36" dur="3s" repeatCount="indefinite"/>
              </circle>
              <circle cx="284" cy="224" r="2" fill="#a3f1ec" opacity="0.4">
                <animate attributeName="cy" values="224;208;224" dur="3.9s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.9s" repeatCount="indefinite"/>
              </circle>
            </svg>
            
            <div class="avatar-info">
              <span class="av-badge">AI AVATAR · STANDBY</span>
              <div class="av-name" id="doctorState">李勇医生</div>
              <div class="av-meta" id="heroDescription">
                <span id="hospitalValue">杭州市第一人民医院</span> · 耳鼻咽喉科 · <span id="focusPrimary">鼻科微创与头颈肿瘤</span>
              </div>
            </div>
          </div>
        </div>
        
        <div class="video-controls">
          <div class="conn-status">
            <span class="conn-dot" id="connDot"></span>
            <span id="connectionState">未启用</span>
          </div>
          <div class="video-actions">
            <button id="keepAliveBtn" class="btn btn-secondary" style="display:none">保持会话</button>
            <button id="disconnectBtn" class="btn btn-danger" style="display:none">断开</button>
            <button id="startConsultBtn" class="btn btn-primary">视频分身</button>
          </div>
        </div>
      </section>

      <!-- 聊天区 -->
      <section class="card chat-section">
        <div id="chatHistory" class="chat-history">
          <div class="message ai">
            <div class="message-label">AI 医疗助手</div>
            <div class="message-bubble">您好，我是李勇医生的 AI 助手，专注耳鼻喉咽科常见问题的健康科普与就医建议。请问有什么可以帮您？</div>
          </div>
        </div>

        <!-- 医生信息（折叠） -->
        <details class="doctor-info">
          <summary>医生信息与资料来源</summary>
          <div class="doctor-info-body">
            <div class="notice-box" id="clinicNote">提醒：仅供健康科普与就医参考，不替代面诊和处方。</div>
            <div id="doctorBio" class="info-text">读取中...</div>
            <div class="tag-list" id="focusTags"></div>
            <ul id="focusList" class="info-list"></ul>
            <div id="officialSources"></div>
          </div>
        </details>

        <!-- 输入区 -->
        <div class="chat-input-area">
          <div id="voiceStatus" class="voice-hint"></div>
          <div class="input-row">
            <textarea id="message" class="chat-textarea" placeholder="输入问题，Ctrl+Enter 发送…" rows="1"></textarea>
            <button id="askBtn" class="send-btn" title="发送">↑</button>
          </div>
          <div class="action-row">
            <button id="voiceInputBtn" class="btn btn-secondary">🎤 语音</button>
            <button id="speakAnswerBtn" class="btn btn-secondary">🔊 朗读</button>
            <button id="stopSpeechBtn" class="btn btn-secondary">⏹ 停止</button>
          </div>
        </div>

        <!-- JS 兼容用的隐藏元素 -->
        <div id="answer" style="display:none;"></div>
        <span id="heroTitle" style="display:none;"></span>
        <span id="modeState" style="display:none;"></span>
        <span id="deptState" style="display:none;"></span>
      </section>

    </main>
  </div>

  <script src="/static/user.js"></script>
</body>
</html>
