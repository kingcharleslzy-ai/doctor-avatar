<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>医疗数字人系统 | MedFlow</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --porcelain: #f2f1e8;
      --cream-2: #e4eee9;
      --paper: #fffdf6;
      --ink: #1e2e2b;
      --ink-soft: #3d504b;
      --ash: #6f7e78;
      --mist: #dcefe8;
      --line: rgba(30, 46, 43, .15);
      --line-strong: rgba(30, 46, 43, .30);
      --surgical: #126b61;
      --surgical-2: #0d3e39;
      --copper: #a46c4a;
      --signal: #21b39e;
      --danger: #8f3430;
      --shadow: 0 24px 58px rgba(18, 107, 97, 0.12);
      --ease: cubic-bezier(.22, 1, .36, 1);
      --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", Georgia, serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "SFMono-Regular", "Cascadia Mono", "Roboto Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(18, 107, 97, .045) 1px, transparent 1px) 0 0 / 78px 78px,
        linear-gradient(180deg, var(--porcelain), var(--cream-2) 58%, var(--porcelain));
      font-family: var(--sans);
      line-height: 1.65;
      overflow: hidden;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(242, 241, 232, .98) 0%, rgba(242, 241, 232, .86) 48%, rgba(220, 239, 232, .62) 100%),
        linear-gradient(180deg, rgba(242, 241, 232, .42), rgba(242, 241, 232, .92)),
        url("/static/medical-field-bg.png") center / cover no-repeat;
      opacity: .72;
      filter: saturate(.88) contrast(.96);
      transform-origin: 58% 45%;
      animation: fieldDrift 30s ease-in-out infinite alternate;
    }

    a { color: inherit; text-decoration: none; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      height: 100dvh;
      min-height: 560px;
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 18px clamp(18px, 3vw, 34px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(22px, 4vh, 44px);
    }

    .topbar {
      min-height: 64px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 24px;
      padding: 0 0 14px;
      border-bottom: 1px solid var(--line);
      background: transparent;
      backdrop-filter: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      position: relative;
      flex: 0 0 auto;
      color: var(--paper);
      background: var(--surgical);
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 15px;
      height: 15px;
      background: var(--signal);
      border: 2px solid var(--porcelain);
      animation: signalPulse 2.8s ease-in-out infinite;
    }

    .brand strong {
      display: block;
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.2;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: var(--ash);
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--ink-soft);
      font-size: 14px;
      white-space: nowrap;
    }

    .nav-action {
      color: var(--paper);
      background: var(--surgical);
      padding: 10px 15px;
      border: 1px solid var(--surgical);
    }

    .workspace {
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(360px, .82fr) minmax(460px, .9fr);
      gap: clamp(34px, 7vw, 96px);
      align-items: stretch;
    }

    .panel {
      min-height: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }

    .stage-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .stage-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 0;
    }

    .kicker {
      display: grid;
      grid-template-columns: 56px auto;
      align-items: center;
      gap: 12px;
      color: var(--surgical-2);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .kicker::before {
      content: "";
      height: 1px;
      background: var(--surgical);
    }

    .mode-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: 0;
      color: var(--surgical-2);
      background: transparent;
      font-family: var(--mono);
      font-size: 11px;
      white-space: nowrap;
    }

    .mode-chip::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--signal);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .stage-body {
      min-height: 0;
      padding: clamp(26px, 5vh, 48px) 0 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: clamp(20px, 3.2vh, 30px);
      overflow: hidden;
    }

    .medflow-art {
      width: min(82%, 360px);
      aspect-ratio: 1.18;
      display: grid;
      place-items: center;
      position: relative;
      justify-self: center;
      color: var(--surgical);
      overflow: hidden;
    }

    .medflow-art::before {
      content: "";
      position: absolute;
      inset: 11% 4% 9% 14%;
      border: 1px solid rgba(30, 46, 43, .12);
    }

    .medflow-art::after {
      content: "";
      position: absolute;
      inset: 13% 2% 11% 12%;
      background: linear-gradient(90deg, transparent, rgba(33, 179, 158, .22), transparent);
      transform: translateX(-115%);
      animation: artScan 6.8s ease-in-out infinite;
      pointer-events: none;
    }

    .medflow-art svg {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      animation: medflowFloat 8s ease-in-out infinite;
    }

    .title-block h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(38px, 4.8vw, 64px);
      line-height: .98;
      letter-spacing: 0;
      font-weight: 700;
    }

    .title-block h1 span {
      display: block;
      color: var(--surgical-2);
      font-style: italic;
    }

    .title-block p {
      max-width: 620px;
      margin: clamp(14px, 2.1vh, 20px) 0 0;
      color: var(--ink-soft);
      font-size: clamp(17px, 1.55vw, 21px);
      line-height: 1.68;
    }

    .action-bar {
      display: grid;
      gap: 10px;
      padding: 0 0 clamp(10px, 1.8vh, 18px);
      border-top: 0;
      background: transparent;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--ash);
      font-size: 13px;
    }

    .conn-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .conn-dot {
      width: 8px;
      height: 8px;
      background: #9aa39c;
      border-radius: 50%;
    }

    .conn-dot.live { background: var(--signal); }

    .primary-actions,
    .input-row,
    .aux-row {
      display: flex;
      gap: 10px;
    }

    .btn,
    .start-consult-btn,
    .end-consult-btn,
    .aux-btn,
    .send-btn {
      min-height: 46px;
      border: 1px solid var(--surgical);
      background: transparent;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      font-weight: 700;
      transition: transform 220ms var(--ease), background 220ms var(--ease), color 220ms var(--ease);
    }

    .start-consult-btn {
      flex: 1;
      background: var(--surgical);
      color: var(--paper);
    }

    .end-consult-btn {
      flex: 1;
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .aux-btn {
      min-height: 38px;
      padding: 0 13px;
      color: var(--ink-soft);
      border-color: rgba(18, 107, 97, .22);
      background: rgba(251, 247, 239, .64);
      font-size: 13px;
    }

    .btn:hover,
    .start-consult-btn:hover,
    .end-consult-btn:hover,
    .aux-btn:hover,
    .send-btn:hover {
      transform: translateY(-2px);
    }

    .chat-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      padding-left: clamp(22px, 4vw, 56px);
      border-left: 1px solid var(--line);
      overflow: hidden;
    }

    .chat-header {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 0 clamp(18px, 3vh, 28px);
      border-bottom: 1px solid var(--line);
      background: transparent;
    }

    .chat-header h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(28px, 3.1vw, 44px);
      line-height: 1.1;
    }

    .chat-model-badge,
    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border: 1px solid rgba(15, 76, 67, .22);
      color: var(--surgical-2);
      background: rgba(251, 247, 239, .72);
      font-family: var(--mono);
      font-size: 11px;
      white-space: nowrap;
    }

    .chat-history {
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      padding: clamp(28px, 5vh, 58px) 0 clamp(18px, 3vh, 30px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      animation: messageIn .34s var(--ease);
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { align-items: flex-end; }
    .msg-row.ai { align-items: flex-start; }

    .ai-label {
      margin-bottom: 6px;
      color: var(--copper);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .bubble {
      max-width: min(82%, 620px);
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
      line-height: 1.8;
    }

    .msg-row.ai .bubble {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
    }

    .msg-row.user .bubble {
      padding: 12px 16px;
      background: var(--surgical-2);
      color: var(--paper);
    }

    .typing-dots {
      display: inline-flex;
      gap: 5px;
      padding: 6px 0;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--surgical);
      border-radius: 50%;
      animation: dot 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: .16s; }
    .typing-dots span:nth-child(3) { animation-delay: .32s; }

    @keyframes dot {
      0%, 100% { opacity: .35; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-5px); }
    }

    .details-section {
      border-top: 1px solid var(--line);
      background: transparent;
    }

    .details-section summary {
      padding: 15px 0;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      user-select: none;
    }

    .details-section summary::-webkit-details-marker { display: none; }
    .details-section summary::after {
      content: "\203A";
      color: var(--ash);
      font-size: 20px;
      transition: transform 180ms var(--ease);
    }
    .details-section[open] summary::after { transform: rotate(90deg); }

    .details-body {
      max-height: 170px;
      overflow-y: auto;
      padding: 0 0 16px;
      display: grid;
      gap: 11px;
      border-top: 1px solid var(--line);
    }

    .notice,
    .output,
    .list,
    .links {
      color: var(--ash);
      font-size: 13px;
      line-height: 1.8;
    }

    .notice {
      padding: 10px 12px;
      border: 1px solid rgba(164, 95, 52, .22);
      color: #7d5a35;
      background: rgba(251, 247, 239, .72);
    }

    .output { white-space: pre-wrap; }
    .list { margin: 0; padding-left: 18px; }
    .links { display: grid; gap: 5px; }
    .links a { color: var(--surgical-2); word-break: break-word; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      padding: 5px 10px;
      border: 1px solid rgba(15, 76, 67, .2);
      background: rgba(251, 247, 239, .72);
      color: var(--surgical-2);
      font-size: 12px;
    }

    .chat-footer {
      padding: 16px 0 18px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 10px;
      background: transparent;
    }

    .voice-hint {
      min-height: 18px;
      color: var(--ash);
      font-size: 12px;
    }

    .chat-textarea {
      flex: 1;
      min-height: 46px;
      max-height: 120px;
      resize: none;
      outline: none;
      padding: 12px 14px;
      color: var(--ink);
      background: rgba(251, 247, 239, .58);
      border: 1px solid rgba(30, 46, 43, .18);
    }

    .chat-textarea:focus {
      border-color: var(--surgical);
      box-shadow: 0 0 0 3px rgba(15, 76, 67, .10);
    }

    .send-btn {
      width: 46px;
      min-width: 46px;
      padding: 0;
      background: var(--surgical);
      color: var(--paper);
    }

    #voiceCallOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      color: var(--paper);
    }

    .vc-bg {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 1px, transparent 1px 8px),
        linear-gradient(160deg, #103b36 0%, #174c44 42%, #082824 100%);
      backdrop-filter: blur(34px);
    }

    .vc-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding-top: 10vh;
    }

    .vc-avatar-area {
      width: 190px;
      height: 190px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .vc-avatar-circle {
      width: 158px;
      height: 158px;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 2;
      border-radius: 50%;
      background: rgba(255, 253, 248, .08);
      border: 1px solid rgba(255, 253, 248, .28);
      overflow: hidden;
    }

    .vc-avatar-circle svg { width: 104px; height: 104px; }

    .vc-ring {
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      border: 1px solid rgba(17, 162, 141, .36);
      opacity: .32;
      pointer-events: none;
    }

    .vc-speaking .vc-ring { animation: vc-expand 2s ease-out infinite; }
    .vc-speaking .vc-ring-2 { animation-delay: .38s; }
    .vc-speaking .vc-ring-3 { animation-delay: .76s; }
    .vc-listening .vc-ring,
    .vc-thinking .vc-ring,
    .vc-idle .vc-ring { animation: vc-breathe 2.6s ease-in-out infinite; }

    @keyframes vc-expand {
      from { opacity: .52; transform: scale(.86); }
      to { opacity: 0; transform: scale(1.35); }
    }

    @keyframes vc-breathe {
      0%, 100% { opacity: .22; transform: scale(1); }
      50% { opacity: .5; transform: scale(1.05); }
    }

    .vc-info {
      position: relative;
      z-index: 1;
      text-align: center;
      display: grid;
      gap: 6px;
    }

    .vc-doctor-name {
      font-family: var(--serif);
      font-size: 28px;
      line-height: 1.1;
    }

    .vc-subtitle,
    .vc-timer {
      color: rgba(255, 253, 248, .62);
      font-size: 13px;
    }

    .vc-status {
      margin-top: 8px;
      min-height: 26px;
      font-size: 18px;
    }

    .vc-waveform {
      position: relative;
      z-index: 1;
      height: 40px;
      display: flex;
      align-items: flex-end;
      gap: 5px;
    }

    .vc-bar {
      width: 4px;
      height: 12px;
      background: var(--signal);
      transform-origin: bottom center;
      transition: transform .15s ease;
    }

    .vc-waveform.vc-wave-active .vc-bar,
    .vc-waveform.vc-wave-speak .vc-bar {
      animation: vc-bar .72s ease-in-out infinite;
    }
    .vc-waveform .vc-bar:nth-child(2) { animation-delay: .08s; }
    .vc-waveform .vc-bar:nth-child(3) { animation-delay: .16s; }
    .vc-waveform .vc-bar:nth-child(4) { animation-delay: .24s; }
    .vc-waveform .vc-bar:nth-child(5) { animation-delay: .32s; }

    @keyframes vc-bar {
      0%, 100% { transform: scaleY(.32); }
      50% { transform: scaleY(1); }
    }

    .vc-controls {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 28px;
      padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    }

    .vc-ctrl-btn {
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 253, 248, .24);
      background: rgba(255, 253, 248, .10);
      color: var(--paper);
      border-radius: 50%;
      transition: transform 160ms var(--ease), background 160ms var(--ease);
    }

    .vc-mute-btn,
    .vc-transcript-btn {
      width: 44px;
      height: 44px;
    }

    .vc-end-btn {
      width: 60px;
      height: 60px;
      background: var(--danger);
      border-color: var(--danger);
    }

    .vc-ctrl-btn:hover { transform: translateY(-2px); }
    .vc-mute-btn.vc-muted { background: rgba(143, 52, 48, .6); }

    .vc-transcript-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      max-height: 50vh;
      display: flex;
      flex-direction: column;
      background: rgba(13, 62, 57, .94);
      border-top: 1px solid rgba(255, 253, 248, .16);
    }

    .vc-transcript-header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 253, 248, .12);
    }

    .vc-transcript-close {
      border: 0;
      background: transparent;
      color: rgba(255, 253, 248, .68);
      font-size: 24px;
    }

    .vc-transcript-content {
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vc-transcript-content .msg-row.ai .bubble {
      color: rgba(255,253,248,.84);
      background: transparent;
      border-color: rgba(255,253,248,.12);
    }

    .vc-transcript-content .msg-row.user .bubble {
      background: rgba(17, 162, 141, .25);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(22, 25, 21, .18); }

    @keyframes signalPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(33, 179, 158, .30);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 7px rgba(33, 179, 158, 0);
        transform: scale(1.08);
      }
    }

    @keyframes fieldDrift {
      from { transform: scale(1) translate3d(0, 0, 0); }
      to { transform: scale(1.035) translate3d(-1%, .6%, 0); }
    }

    @keyframes medflowFloat {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -6px, 0); }
    }

    @keyframes artScan {
      0%, 50% { transform: translateX(-115%); opacity: 0; }
      62% { opacity: 1; }
      84%, 100% { transform: translateX(115%); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      body::before,
      .brand-mark::after,
      .medflow-art::after,
      .medflow-art svg {
        animation: none !important;
        transform: none !important;
      }
    }

    @media (min-width: 1081px) and (max-height: 700px) {
      .app-shell {
        min-height: 0;
        padding: 12px;
        gap: 12px;
      }

      .topbar {
        min-height: 58px;
        padding: 8px 16px;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
      }

      .workspace {
        gap: 12px;
      }

      .stage-header {
        padding: 0;
      }

      .stage-body {
        padding-top: 18px;
        gap: 14px;
      }

      .medflow-art {
        width: min(76%, 300px);
      }

      .title-block h1 {
        font-size: clamp(34px, 3.6vw, 50px);
      }

      .title-block p {
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.48;
      }

      .action-bar {
        padding: 0;
        gap: 8px;
      }

      .start-consult-btn,
      .end-consult-btn,
      .send-btn {
        min-height: 40px;
      }

      .chat-header {
        padding: 0 0 12px;
      }

      .chat-header h2 {
        font-size: 24px;
      }

      .chat-history {
        padding: 16px 0;
        gap: 10px;
      }

      .bubble {
        font-size: 14px;
        line-height: 1.65;
      }

      .details-section summary {
        padding: 11px 0;
      }

      .chat-footer {
        padding: 10px 0 12px;
        gap: 8px;
      }

      .chat-textarea {
        min-height: 42px;
        padding: 10px 12px;
      }

      .aux-btn {
        min-height: 34px;
      }
    }

    @media (max-width: 1080px) {
      body { overflow: hidden; }
      .app-shell { height: 100dvh; min-height: 560px; }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(250px, 46%) minmax(0, 1fr);
      }
      .chat-panel {
        padding-left: 0;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .medflow-art { width: min(50vw, 280px); }
    }

    @media (max-width: 760px) {
      .app-shell {
        height: 100dvh;
        min-height: 560px;
        padding: 0;
        gap: 0;
      }

      .topbar {
        min-height: 68px;
        grid-template-columns: 1fr auto;
        padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 8px;
        border-left: 0;
        border-right: 0;
      }

      .brand-mark { width: 40px; height: 40px; }
      .brand strong { font-size: 17px; }
      .brand span { font-size: 11px; }
      .nav-links a:not(.nav-action) { display: none; }
      .nav-action { padding: 8px 10px; font-size: 12px; }

      .workspace {
        height: 100%;
        min-height: 0;
        gap: 0;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: minmax(250px, 43%) minmax(0, 57%);
      }

      .panel {
        border-left: 0;
        border-right: 0;
        box-shadow: none;
      }

      .stage-header {
        padding: 12px 16px 0;
      }

      .kicker {
        display: none;
      }

      .mode-chip {
        padding: 6px 9px;
        font-size: 10px;
      }

      .stage-body {
        padding: 14px 16px 0;
        grid-template-columns: 108px minmax(0, 1fr);
        grid-template-rows: auto;
        gap: 16px;
        align-items: center;
      }

      .medflow-art {
        width: 108px;
      }

      .title-block h1 {
        font-size: clamp(30px, 9.2vw, 44px);
      }

      .title-block p {
        font-size: 13px;
        line-height: 1.55;
        margin-top: 8px;
      }

      .action-bar {
        padding: 8px 16px 10px;
        gap: 7px;
      }

      .status-line {
        font-size: 12px;
      }

      .primary-actions,
      .aux-row {
        flex-wrap: wrap;
      }

      .start-consult-btn,
      .end-consult-btn,
      .send-btn {
        min-height: 40px;
      }

      .chat-panel {
        min-height: 0;
        border-top: 0;
        padding-left: 0;
      }

      .chat-header {
        min-height: 52px;
        padding: 10px 16px;
      }

      .chat-header h2 {
        font-size: 20px;
      }

      .chat-history {
        padding: 12px 16px;
        gap: 10px;
      }

      .bubble {
        max-width: 92%;
        font-size: 14px;
        line-height: 1.65;
      }

      .details-body {
        max-height: 150px;
      }

      .chat-footer {
        padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 8px));
        gap: 7px;
      }

      .chat-textarea {
        min-height: 40px;
        padding: 9px 12px;
      }

      .aux-btn {
        min-height: 32px;
      }

      .voice-hint {
        min-height: 14px;
      }
    }

    @media (max-width: 760px) and (max-height: 680px) {
      .app-shell { min-height: 0; }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(168px, 38%) minmax(0, 62%);
      }
      .topbar {
        min-height: 62px;
      }
      .brand > span:not(.brand-mark) span { display: none; }
      .stage-header {
        padding: 10px 12px 0;
      }
      .kicker {
        display: block;
        font-size: 10px;
        line-height: 1.45;
      }
      .kicker::before { display: none; }
      .mode-chip { display: none; }
      .stage-body {
        padding: 8px 12px 0;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 10px;
      }
      .medflow-art {
        width: 72px;
      }
      .title-block h1 {
        font-size: clamp(24px, 6.4vw, 34px);
      }
      .title-block p {
        display: none;
      }
      .action-bar {
        padding: 8px 12px;
      }
      .status-line {
        display: none;
      }
      .details-section {
        display: none;
      }
      .chat-model-badge {
        display: none;
      }
      .chat-header {
        min-height: 44px;
        padding: 8px 12px;
      }
      .chat-header h2 {
        font-size: 18px;
      }
      .chat-history {
        padding: 10px 12px;
      }
      .msg-row.ai .bubble {
        padding: 0;
      }
      .chat-footer {
        padding: 8px 12px;
      }
      .aux-row {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="返回 MedFlow 官网">
        <span class="brand-mark">M</span>
        <span>
          <strong>MedFlow</strong>
          <span>杭州 MedFlow 智能科技工作室</span>
        </span>
      </a>
      <nav class="nav-links" aria-label="页面导航">
        <a href="/">MedFlow 官网</a>
        <a href="/rhinitis-ai">专病 AI</a>
        <a class="nav-action" href="/hospital-ai">数字人系统</a>
      </nav>
    </header>

    <main class="workspace">
      <section class="panel stage-panel" aria-label="数字人演示舞台">
        <div class="stage-header">
          <div class="kicker">AI Medical Assistant / Voice Consult</div>
          <div class="mode-chip" id="modeState">语音待命</div>
        </div>

        <div class="stage-body">
          <div class="medflow-art" aria-label="MedFlow 抽象标识">
            <svg viewBox="0 0 520 420" role="img" aria-labelledby="medflowArtTitle">
              <title id="medflowArtTitle">MedFlow geometric mark</title>
              <defs>
                <linearGradient id="flowInk" x1="112" x2="394" y1="312" y2="118" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#0d3e39" />
                  <stop offset=".62" stop-color="#126b61" />
                  <stop offset="1" stop-color="#21b39e" />
                </linearGradient>
              </defs>
              <rect x="120" y="70" width="280" height="280" fill="none" stroke="#1e2e2b" stroke-opacity=".14" />
              <path d="M166 312V128L260 250L354 128V312" fill="none" stroke="url(#flowInk)" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter" />
              <path d="M86 210h54M380 210h54M120 104h48M352 104h48M120 316h48M352 316h48" fill="none" stroke="#126b61" stroke-opacity=".28" stroke-width="2" />
              <path d="M120 128v-32h32M400 292v32h-32" fill="none" stroke="#a96843" stroke-width="3" stroke-linecap="square" />
              <rect x="386" y="118" width="16" height="16" fill="#21b39e" />
              <rect x="118" y="286" width="10" height="10" fill="#a96843" />
              <text x="260" y="382" text-anchor="middle" fill="#6f7e78" font-family="SFMono-Regular, Cascadia Mono, Roboto Mono, monospace" font-size="12" letter-spacing="3">MEDFLOW</text>
            </svg>
          </div>

          <div class="title-block">
            <h1 id="heroTitle">李勇医生<span>AI 医疗助手</span></h1>
            <p id="heroDescription">
              专注耳鼻咽喉科常见问题的健康科普与就医建议，可通过文字或语音进行咨询。
            </p>
          </div>
        </div>

        <div class="action-bar">
          <div class="status-line">
            <div class="conn-status">
              <span class="conn-dot" id="connDot"></span>
              <span id="connectionState">语音待命</span>
            </div>
            <span id="hospitalValue">杭州市第一人民医院</span>
          </div>
          <div class="primary-actions">
            <button id="startConsultBtn" class="start-consult-btn" type="button">开始问诊</button>
            <button id="endConsultBtn" class="end-consult-btn" type="button" style="display:none">结束问诊</button>
          </div>
        </div>
      </section>

      <section class="panel chat-panel" aria-label="AI 医疗助手对话">
        <div class="chat-header">
          <h2>AI 医疗助手</h2>
          <span class="chat-model-badge">AI Assistant</span>
        </div>

        <div id="chatHistory" class="chat-history"></div>

        <details class="details-section">
          <summary>医生信息与资料来源</summary>
          <div class="details-body">
            <div class="notice" id="clinicNote">提醒：仅供健康科普与就医参考，不替代面诊和处方。</div>
            <div id="doctorBio" class="output muted">读取中...</div>
            <div class="chips" id="focusTags"></div>
            <ul id="focusList" class="list"></ul>
            <div id="officialSources" class="links"></div>
          </div>
        </details>

        <div class="chat-footer">
          <div id="voiceStatus" class="voice-hint"></div>
          <div class="input-row">
            <textarea id="message" class="chat-textarea" placeholder="输入问题，Ctrl+Enter 发送..." rows="1"></textarea>
            <button id="askBtn" class="send-btn" type="button" title="发送" aria-label="发送文字问题">&#8593;</button>
          </div>
          <div class="aux-row">
            <button id="voiceInputBtn" class="aux-btn" type="button">语音</button>
            <button id="stopSpeechBtn" class="aux-btn" type="button">停止</button>
          </div>
        </div>

        <div id="answer" style="display:none;"></div>
        <span id="doctorState" style="display:none;"></span>
        <span id="deptState" style="display:none;"></span>
        <span id="focusPrimary" style="display:none;"></span>
      </section>
    </main>
  </div>

  <div id="voiceCallOverlay" style="display:none;">
    <div class="vc-bg"></div>
    <div class="vc-content">
      <div id="vcAvatar" class="vc-avatar-area">
        <div class="vc-ring vc-ring-1"></div>
        <div class="vc-ring vc-ring-2"></div>
        <div class="vc-ring vc-ring-3"></div>
        <div class="vc-avatar-circle">
          <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
            <circle cx="50" cy="50" r="31" fill="rgba(255,253,248,.12)" stroke="rgba(255,253,248,.32)" />
            <path d="M31 57c4-13 11-20 19-20s15 7 19 20" stroke="#11a28d" stroke-width="4" stroke-linecap="round" />
            <path d="M36 65h28" stroke="rgba(255,253,248,.72)" stroke-width="3" stroke-linecap="round" />
            <circle cx="42" cy="48" r="3" fill="#fffdf8" />
            <circle cx="58" cy="48" r="3" fill="#fffdf8" />
          </svg>
        </div>
      </div>
      <div class="vc-info">
        <div class="vc-doctor-name">李勇医生</div>
        <div class="vc-subtitle">耳鼻咽喉科 · AI 问诊</div>
        <div id="vcStatus" class="vc-status">正在连接...</div>
        <div id="vcTimer" class="vc-timer">00:00</div>
      </div>
      <div id="vcWaveform" class="vc-waveform">
        <span class="vc-bar"></span>
        <span class="vc-bar"></span>
        <span class="vc-bar"></span>
        <span class="vc-bar"></span>
        <span class="vc-bar"></span>
      </div>
    </div>
    <div class="vc-controls">
      <button id="vcMuteBtn" class="vc-ctrl-btn vc-mute-btn" title="静音" aria-label="静音" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
      </button>
      <button id="vcEndBtn" class="vc-ctrl-btn vc-end-btn" title="结束问诊" aria-label="结束问诊" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <button id="vcTranscriptBtn" class="vc-ctrl-btn vc-transcript-btn" title="文字记录" aria-label="打开文字记录" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
      </button>
    </div>
    <div id="vcTranscriptPanel" class="vc-transcript-panel" style="display:none;">
      <div class="vc-transcript-header">
        <span>对话记录</span>
        <button id="vcTranscriptClose" class="vc-transcript-close" type="button" aria-label="关闭文字记录">&times;</button>
      </div>
      <div id="vcTranscriptContent" class="vc-transcript-content"></div>
    </div>
  </div>

  <script src="/static/user.js?v={{ v }}"></script>
</body>
</html>
