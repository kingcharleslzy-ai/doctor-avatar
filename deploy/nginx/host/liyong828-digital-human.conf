limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream doctor_avatar_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name liyong828.com www.liyong828.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = / {
        return 301 https://$host/hospital-ai;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name liyong828.com www.liyong828.com;

    ssl_certificate /etc/letsencrypt/live/liyong828.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liyong828.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* ^/(?:\.env(?:$|[./])|\.git(?:$|/)|wp-admin(?:$|/)|wp-login\.php$|wordpress(?:$|/)|phpmyadmin(?:$|/)|cgi-bin(?:$|/)|xmlrpc\.php$) {
        return 444;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }

    location = / {
        return 302 /hospital-ai;
    }

    location = /desktop {
        return 302 /hospital-ai;
    }

    location = /mobile {
        return 302 /hospital-ai;
    }

    location = /hospital-ai {
        proxy_pass http://doctor_avatar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /static/ {
        proxy_pass http://doctor_avatar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /favicon.ico {
        proxy_pass http://doctor_avatar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://doctor_avatar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/app-config {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn per_ip_conn 30;
        proxy_pass http://doctor_avatar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /api/doctor-profile {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn per_ip_conn 30;
        proxy_pass http://doctor_avatar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /api/ops/presence {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_conn per_ip_conn 30;
        proxy_pass http://doctor_avatar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /ws/doubao/realtime {
        limit_conn per_ip_conn 5;
        proxy_pass http://doctor_avatar_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /api/ {
        return 404;
    }

    location ^~ /ws/ {
        return 404;
    }

    location / {
        return 302 /hospital-ai;
    }
}
