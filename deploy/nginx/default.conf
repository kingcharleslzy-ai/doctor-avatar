# 温和的基础防护：隐藏版本号、限制 API 突发、直接丢弃常见探测路径
server_tokens off;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

# HTTP：ACME 验证直接返回，其余跳转 HTTPS
server {
    listen 80;
    server_name liyong828.com www.liyong828.com doctor.liyong828.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~* ^/(?:\.env(?:$|[./])|\.git(?:$|/)|wp-admin(?:$|/)|wp-login\.php$|wordpress(?:$|/)|phpmyadmin(?:$|/)|cgi-bin(?:$|/)|xmlrpc\.php$) {
        return 444;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name liyong828.com www.liyong828.com doctor.liyong828.com;

    ssl_certificate     /etc/letsencrypt/live/liyong828.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liyong828.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    # NOTE: text/event-stream excluded — gzip buffers SSE data, defeating streaming
    gzip_min_length 256;

    client_max_body_size 20m;

    location ~* ^/(?:\.env(?:$|[./])|\.git(?:$|/)|wp-admin(?:$|/)|wp-login\.php$|wordpress(?:$|/)|phpmyadmin(?:$|/)|cgi-bin(?:$|/)|xmlrpc\.php$) {
        return 444;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }

    location ^~ /api/ {
        limit_req          zone=api_per_ip burst=60 nodelay;
        limit_conn         per_ip_conn 30;
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;   # Keep realtime API responses unbuffered
    }

    # JS/CSS 不缓存，保证部署后立即生效
    location ~* \.(js|css)$ {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control     "no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
