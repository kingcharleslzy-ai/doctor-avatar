name: Install Hermes SSH Root Key

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "One-line Hermes SSH public key for full root login, for example: cat ~/.ssh/hermes_doctor_avatar_aliyun.pub"
        required: true
        type: string

jobs:
  install-hermes-key:
    runs-on: self-hosted
    steps:
      - name: Sync repository on server
        run: |
          cd /root/doctor-avatar
          git fetch origin
          git checkout main
          git reset --hard origin/main

      - name: Install deploy command, authorized key, and sshd config
        env:
          HERMES_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail

          cd /root/doctor-avatar
          install -m 0755 deploy/server/hermes-deploy-command /usr/local/bin/doctor-avatar-hermes-deploy

          key_file="$(mktemp)"
          filtered_keys="$(mktemp)"
          trap 'rm -f "$key_file" "$filtered_keys"' EXIT

          printf '%s\n' "$HERMES_PUBLIC_KEY" > "$key_file"

          if [ "$(wc -l < "$key_file")" -ne 1 ]; then
            echo "Expected a single-line SSH public key." >&2
            exit 1
          fi

          key_type="$(awk '{print $1}' "$key_file")"
          case "$key_type" in
            ssh-ed25519|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521|ssh-rsa) ;;
            *)
              echo "Unsupported SSH public key type: ${key_type}" >&2
              exit 1
              ;;
          esac

          if ! ssh-keygen -lf "$key_file"; then
            echo "Invalid SSH public key." >&2
            exit 1
          fi

          key_blob="$(awk '{print $2}' "$key_file")"
          normalized_key="$(awk '{comment=$3; if (comment=="") comment="hermes-doctor-avatar-deploy"; print $1 " " $2 " " comment}' "$key_file")"
          install -d -m 0700 /root/.ssh
          touch /root/.ssh/authorized_keys
          chmod 0600 /root/.ssh/authorized_keys
          chown -R root:root /root/.ssh

          awk -v blob="$key_blob" 'index($0, blob) == 0 { print }' /root/.ssh/authorized_keys > "$filtered_keys"
          cat "$filtered_keys" > /root/.ssh/authorized_keys
          printf '%s\n' "$normalized_key" >> /root/.ssh/authorized_keys

          install -d -m 0755 /etc/ssh/sshd_config.d
          {
            echo "PermitRootLogin prohibit-password"
            echo "PubkeyAuthentication yes"
            echo "AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2"
            echo "MaxStartups 100:30:200"
          } > /etc/ssh/sshd_config.d/99-hermes-root-login.conf

          if sshd -T 2>/dev/null | grep -q '^persourcepenalties '; then
            echo "PerSourcePenalties no" >> /etc/ssh/sshd_config.d/99-hermes-root-login.conf
          fi

          if [ -f /etc/hosts.deny ] && grep -Eq '^[[:space:]]*(sshd|ALL)[[:space:]]*:' /etc/hosts.deny; then
            touch /etc/hosts.allow
            if ! grep -Eq '^[[:space:]]*sshd[[:space:]]*:[[:space:]]*ALL' /etc/hosts.allow; then
              printf '\nsshd: ALL\n' >> /etc/hosts.allow
            fi
          fi

          if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
            ufw allow 22/tcp
          fi

          sshd -t
          if systemctl list-unit-files ssh.service >/dev/null 2>&1; then
            systemctl restart ssh
          elif systemctl list-unit-files sshd.service >/dev/null 2>&1; then
            systemctl restart sshd
          else
            echo "Neither ssh.service nor sshd.service was found." >&2
            exit 1
          fi

          echo "Effective sshd settings for root:"
          sshd -T -C user=root,host=aliyun-doctor-avatar,addr=127.0.0.1 \
            | grep -E '^(port|listenaddress|permitrootlogin|pubkeyauthentication|authorizedkeysfile|passwordauthentication|kbdinteractiveauthentication|usepam|maxstartups|persourcepenalties|allowusers|denyusers)' \
            || true
          ss -ltnp | grep -E '(:22[[:space:]])' || true
          journalctl -u ssh --since '-15 minutes' --no-pager | tail -n 80 || true

          echo "Hermes SSH key installed for full root login."
          echo "The key can open an interactive root shell and run arbitrary root commands."
