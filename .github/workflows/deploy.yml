name: Deploy to Server

on:
  push:
    branches: [main]

# 同一时间只运行一个部署，不打断进行中的任务（docker compose 中途取消会留烂摊子）
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # runner 必须以 root 安装（部署目录在 /root/doctor-avatar）
    # 安装方式参见 README > 自动部署
    runs-on: self-hosted
    steps:
      - name: Sync to latest commit
        run: |
          cd /root/doctor-avatar
          git fetch origin
          git checkout main
          git reset --hard origin/main

      - name: Write build metadata
        run: |
          cd /root/doctor-avatar
          cat > app/build_meta.json <<EOF
          {
            "version": "0.1.0",
            "git_sha": "${GITHUB_SHA}",
            "git_short_sha": "${GITHUB_SHA::7}",
            "ref_name": "${GITHUB_REF_NAME}",
            "deployed_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "source": "github-actions-self-hosted"
          }
          EOF

      - name: Rebuild and restart containers
        run: |
          cd /root/doctor-avatar
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Sync doctor memory snapshot
        run: |
          cd /root/doctor-avatar
          docker compose -f docker-compose.prod.yml exec -T app python scripts/sync_memory_snapshot.py --prune-missing

      - name: Restart app after memory sync
        run: |
          cd /root/doctor-avatar
          docker compose -f docker-compose.prod.yml restart app

      - name: Restart nginx to apply config
        run: |
          docker compose -f /root/doctor-avatar/docker-compose.prod.yml restart nginx
