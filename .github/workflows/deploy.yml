name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /root/doctor-avatar
          git pull origin main

      - name: Rebuild and restart containers
        run: |
          cd /root/doctor-avatar
          docker compose -f docker-compose.prod.yml up -d --build
