name: Deploy to Server

on:
  push:
    branches: [main]

# 同一时间只运行一个部署，不打断进行中的任务（docker compose 中途取消会留烂摊子）
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # runner 必须以 root 安装（部署目录在 /root/doctor-avatar）
    # 安装方式参见 README > 自动部署
    runs-on: self-hosted
    steps:
      - name: Sync to latest commit
        run: |
          cd /root/doctor-avatar
          git fetch origin
          git checkout main
          git reset --hard origin/main

      - name: Write build metadata
        run: |
          cd /root/doctor-avatar
          cat > app/build_meta.json <<EOF
          {
            "version": "0.1.0",
            "git_sha": "${GITHUB_SHA}",
            "git_short_sha": "${GITHUB_SHA::7}",
            "ref_name": "${GITHUB_REF_NAME}",
            "deployed_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "source": "github-actions-self-hosted"
          }
          EOF

      - name: Rebuild and restart containers
        run: |
          cd /root/doctor-avatar
          docker compose -f docker-compose.prod.yml -f docker-compose.host-proxy.yml up -d --build app

      - name: Sync doctor memory snapshot
        run: |
          cd /root/doctor-avatar
          docker compose -f docker-compose.prod.yml -f docker-compose.host-proxy.yml exec -T app python scripts/sync_memory_snapshot.py --prune-missing

      - name: Restart app after memory sync
        run: |
          cd /root/doctor-avatar
          docker compose -f docker-compose.prod.yml -f docker-compose.host-proxy.yml restart app

      - name: Install and reload host nginx
        run: |
          cd /root/doctor-avatar
          install -m 0644 deploy/nginx/host/000-default-deny.conf /etc/nginx/sites-available/000-default-deny
          install -m 0644 deploy/nginx/host/doctor-avatar.conf /etc/nginx/sites-available/doctor-avatar
          ln -sfn /etc/nginx/sites-available/000-default-deny /etc/nginx/sites-enabled/000-default-deny
          ln -sfn /etc/nginx/sites-available/doctor-avatar /etc/nginx/sites-enabled/doctor-avatar
          rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/biz-data-hub /etc/nginx/sites-enabled/biz-data-hub.bak
          nginx -t
          systemctl reload nginx
